<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DocBot — Chatbot tài liệu doanh nghiệp</title>
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
<div style="min-height:100vh;display:grid;place-items:center">
  <div style="text-align:center">
    <div class="brand-mark" style="margin:0 auto 14px;width:44px;height:44px;font-size:20px">D</div>
    <p class="muted">Đang chuyển hướng…</p>
  </div>
</div>
<script type="module">
  import { Session, api } from '/assets/app.js';
  (async () => {
    if (!Session.token) return (location.href = '/login.html');
    try {
      const me = await api('/auth/me');
      if (me.user.is_system_admin) return (location.href = '/sysadmin.html');
      const adminOrg = me.organizations.find((o) => o.role === 'admin');
      location.href = adminOrg ? '/admin.html' : '/chat.html';
    } catch { location.href = '/login.html'; }
  })();
</script>
</body>
</html>
