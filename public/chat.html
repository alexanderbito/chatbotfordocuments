<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ask your documents — DocBot</title>
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
<div id="trialBar"></div>
<div class="shell" id="shell"></div>

<script type="module">
import {api, Session, requireSession, buildSidebar, logout, icon, esc, fmt, toast, emptyState, t, trialBanner} from '/assets/app.js';

const me = await requireSession();
if (!me.organizations.length) {
  document.body.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px">
    <div><h1>You are not part of any organization</h1>
    <p class="muted mt-1">Ask your company administrator to invite you.</p>
    <button class="btn mt-2" onclick="localStorage.clear();location.href='/login.html'">Sign out</button></div></div>`;
  throw new Error('no org');
}

let orgId = me.organizations.some((o) => o.id === Session.orgId) ? Session.orgId : me.organizations[0].id;
Session.orgId = orgId;
let currentOrg = me.organizations.find((o) => o.id === orgId);
let trial = currentOrg?.trial || null;
let folders = [];

function render() {
  const isAdmin = currentOrg.role === 'admin' || me.user.is_system_admin;
  document.getElementById('shell').innerHTML = `
    ${buildSidebar({
      brandSub: 'Workspace',
      user: me.user,
      orgs: me.organizations,
      currentOrgId: orgId,
      items: [
        { group: 'Chat' },
        { view: 'chat', icon: 'chat', label: 'Ask your documents' },
        { view: 'history', icon: 'history', label: 'My history' },
      ],
    })}
    <div class="main">
      <div class="topbar">
        <div class="title">
          <h1 id="pageTitle">Ask your documents</h1>
          <p id="pageDesc">${esc(t('The chatbot answers only from documents approved for {org}.', { org: currentOrg.name }))}</p>
        </div>
        ${isAdmin ? `<a class="btn" href="/admin.html">${icon.settings} Admin console</a>` : ''}
        ${me.user.is_system_admin ? `<a class="btn" href="/sysadmin.html">${icon.shield} System admin</a>` : ''}
      </div>

      <div class="page-section active" data-view="chat">
        <div class="chat-layout">
          <div class="chat-scroll" id="chatScroll"><div class="chat-inner" id="chatInner"></div></div>
          <div class="composer">
            <div class="composer-inner">
              <div class="composer-box">
                <textarea id="q" rows="1" placeholder="Ask a question about your company documents…"></textarea>
                <button class="btn primary" id="sendBtn">${icon.send} Send</button>
              </div>
              <div class="meta">
                <span>Enter to send · Shift+Enter for a new line</span>
                <span class="spacer"></span>
                <label class="row" style="gap:6px">Scope:
                  <select id="folderScope" style="width:auto;padding:3px 8px;font-size:12px"></select>
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="page-section" data-view="history">
        <div class="page"><div class="card"><div class="card-body" id="historyBox">Loading…</div></div></div>
      </div>
    </div>`;

  document.getElementById('trialBar').innerHTML = trialBanner(trial);

  document.getElementById('logoutBtn').onclick = logout;
  document.getElementById('orgSwitch').onchange = (e) => { Session.orgId = e.target.value; location.reload(); };

  document.querySelectorAll('.nav-item[data-view]').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('.nav-item[data-view]').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      document.querySelectorAll('.page-section').forEach((s) => s.classList.toggle('active', s.dataset.view === b.dataset.view));
      const isChat = b.dataset.view === 'chat';
      document.getElementById('pageTitle').textContent = isChat ? t('Ask your documents') : t('My history');
      document.getElementById('pageDesc').textContent = isChat
        ? t('The chatbot answers only from documents approved for {org}.', { org: currentOrg.name })
        : t('Your 50 most recent questions.');
      if (!isChat) loadHistory();
    };
  });
  document.querySelector('.nav-item[data-view="chat"]').classList.add('active');

  const ta = document.getElementById('q');
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(160, ta.scrollHeight) + 'px'; };
  ta.onkeydown = (e) => {
    // An input method editor — Vietnamese Telex/VNI, Chinese pinyin, Japanese
    // kana and the rest — uses Enter itself to commit the characters being
    // composed. keydown still reports key === 'Enter' at that moment, but the
    // textarea does not hold the final character yet: sending here would post a
    // question with its last character missing and then drop that character
    // into the freshly cleared box. isComposing marks exactly that moment
    // (keyCode 229 is the same signal on older browsers).
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
  };
  document.getElementById('sendBtn').onclick = ask;

  greet();
  loadFolders();
}

function greet() {
  document.getElementById('chatInner').innerHTML = `
    <div style="text-align:center;padding:48px 10px" data-greet>
      <div class="brand-mark" style="margin:0 auto 14px;width:42px;height:42px;font-size:19px">D</div>
      <h2>${esc(t('Hello'))} <span>${esc(me.user.full_name || me.user.email.split('@')[0])}</span></h2>
      <p class="muted mt-1">Ask about your internal documents. Every answer cites the source file.</p>
      <div class="row wrap mt-2" style="justify-content:center">
        ${[t('Summarise the main points of the latest document'), t('How does the leave request process work?'), t('What does the information security policy cover?')]
          .map((s) => `<button class="btn sm" data-suggest="${esc(s)}">${esc(s)}</button>`).join('')}
      </div>
    </div>`;
  document.querySelectorAll('[data-suggest]').forEach((b) => {
    b.onclick = () => { document.getElementById('q').value = b.dataset.suggest; ask(); };
  });
}

async function loadFolders() {
  try {
    const res = await api(`/orgs/${orgId}/folders`);
    folders = res.folders;
    const sel = document.getElementById('folderScope');
    sel.innerHTML = `<option value="">${esc(t('All documents I can access'))}</option>` +
      folders.map((f) => `<option value="${esc(f.id)}">${f.visibility === 'private' ? '🔒 ' : ''}${esc(f.name)} (${f.document_count})</option>`).join('');
  } catch { /* folder list unavailable: fall back to asking across everything in scope */ }
}

function bubble(role, html) {
  const inner = document.getElementById('chatInner');
  if (inner.querySelector('[data-suggest]')) inner.innerHTML = '';
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.innerHTML = `
    <div class="bubble-avatar">${role === 'user' ? esc((me.user.full_name || me.user.email)[0].toUpperCase()) : 'D'}</div>
    <div class="body">
      <div class="who">${role === 'user' ? esc(me.user.full_name || t('You')) : 'DocBot'}</div>
      <div class="text">${html}</div>
      <div class="srcs"></div>
    </div>`;
  inner.appendChild(el);
  const scroll = document.getElementById('chatScroll');
  scroll.scrollTop = scroll.scrollHeight;
  return el;
}

let busy = false;
async function ask() {
  if (busy) return;
  const ta = document.getElementById('q');
  const question = ta.value.trim();
  if (!question) return;

  ta.value = ''; ta.style.height = 'auto';
  bubble('user', esc(question));

  const botEl = bubble('bot', `<span class="typing"><span></span><span></span><span></span></span>`);
  busy = true;
  document.getElementById('sendBtn').disabled = true;

  try {
    const folderId = document.getElementById('folderScope').value;
    const data = await api(`/orgs/${orgId}/chat`, {
      method: 'POST',
      body: { question, folder_ids: folderId ? [folderId] : null },
    });
    botEl.querySelector('.text').innerHTML = esc(data.answer);
    botEl.querySelector('.srcs').innerHTML = (data.sources || [])
      .map((s) => `<span class="src-chip">${icon.file}${esc(s)}</span>`).join('');
  } catch (err) {
    botEl.querySelector('.text').innerHTML = `<span style="color:var(--danger)">${esc(err.message)}</span>`;
  } finally {
    busy = false;
    document.getElementById('sendBtn').disabled = false;
    const scroll = document.getElementById('chatScroll');
    scroll.scrollTop = scroll.scrollHeight;
  }
}

async function loadHistory() {
  const box = document.getElementById('historyBox');
  box.innerHTML = 'Loading…';
  try {
    const items = await api(`/orgs/${orgId}/chat/mine`);
    if (!items.length) return (box.innerHTML = emptyState('No questions yet', 'Your history appears here once you start asking.'));
    box.innerHTML = items.reverse().map((m) => `
      <div style="padding:14px 0;border-bottom:1px solid var(--border)">
        <div class="row between"><b>${esc(m.question)}</b><span class="small muted nowrap">${esc(fmt.ago(m.created_at))}</span></div>
        <div class="muted mt-1" style="white-space:pre-wrap">${esc(m.answer || '')}</div>
        <div class="srcs mt-1">${(m.sources || []).map((s) => `<span class="src-chip">${icon.file}${esc(s)}</span>`).join('')}</div>
      </div>`).join('');
  } catch (err) { box.innerHTML = `<div class="muted">${esc(err.message)}</div>`; }
}

render();
</script>
</body>
</html>
