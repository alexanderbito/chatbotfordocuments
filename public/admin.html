<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Organization admin — BotClarify</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/assets/brand/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
<meta name="theme-color" content="#ff6320" />
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
<div id="trialBar"></div>
<div class="shell" id="shell"></div>

<script type="module">
import {api, Session, requireSession, buildSidebar, logout, icon, esc, fmt, toast, modal, confirmDialog, emptyState, badge, LABEL, meter, renderBars, debounce, router, t, money, trialBanner, downloadFile} from '/assets/app.js';

const me = await requireSession();
const adminOrgs = me.user.is_system_admin ? me.organizations : me.organizations.filter((o) => o.role === 'admin');
if (!adminOrgs.length) location.href = '/chat.html';

let orgId = adminOrgs.some((o) => o.id === Session.orgId) ? Session.orgId : adminOrgs[0].id;
Session.orgId = orgId;
let org = null;
let trial = adminOrgs.find((o) => o.id === orgId)?.trial || null;
let state = { folder: null, folders: [], unfiled: 0, historyPage: 1 };

const TITLES = {
  overview: ['Overview', 'A quick picture of documents, members and usage.'],
  documents: ['Documents & folders', 'Upload, organise and control what the chatbot can read.'],
  members: ['Members', 'Invite colleagues and set who can use the chatbot.'],
  history: ['Chat history', 'Every question members asked and how the chatbot answered.'],
  billing: ['Plan & billing', 'Current usage and payment history.'],
  settings: ['Settings', 'Company profile and your account.'],
};

function shell() {
  document.getElementById('shell').innerHTML = `
    ${buildSidebar({
      brandSub: 'Organization admin',
      user: me.user,
      orgs: adminOrgs,
      currentOrgId: orgId,
      items: [
        { group: 'Operations' },
        { view: 'overview', icon: 'dashboard', label: 'Overview' },
        { view: 'documents', icon: 'folder', label: 'Documents & folders' },
        { view: 'members', icon: 'users', label: 'Members' },
        { view: 'history', icon: 'history', label: 'Chat history' },
        { group: 'Account' },
        { view: 'billing', icon: 'card', label: 'Plan & billing' },
        { view: 'settings', icon: 'settings', label: 'Settings' },
      ],
    })}
    <div class="main">
      <div class="topbar">
        <div class="title"><h1 id="ttl">Overview</h1><p id="dsc"></p></div>
        <a class="btn" href="/pricing.html">${icon.card} Pricing</a>
        <a class="btn" href="/chat.html">${icon.chat} Open chatbot</a>
      </div>
      <div class="page">
        ${['overview', 'documents', 'members', 'history', 'billing', 'settings']
          .map((v) => `<section class="page-section" data-view="${v}" id="view-${v}"></section>`).join('')}
      </div>
    </div>`;


  document.getElementById('logoutBtn').onclick = logout;
  document.getElementById('orgSwitch').onchange = (e) => { Session.orgId = e.target.value; location.reload(); };
}

/* =================== OVERVIEW =================== */
async function viewOverview() {
  const el = document.getElementById('view-overview');
  el.innerHTML = '<div class="loading-line"></div>';
  const d = await api(`/orgs/${orgId}/overview`);
  const u = d.usage, L = u.limits;

  const stat = (label, value, ic, foot, used, limit) => `
    <div class="stat">
      <div class="row between"><div class="label">${esc(label)}</div><div class="icon">${icon[ic]}</div></div>
      <div class="value">${value}</div>
      ${limit !== undefined ? meter(used, limit) : ''}
      ${foot ? `<div class="foot">${foot}</div>` : ''}
    </div>`;

  el.innerHTML = `
    <div class="stat-grid">
      ${stat('Documents', `${fmt.num(u.documents)} <small>/ ${fmt.num(L.max_documents)}</small>`, 'file', t('{ready} ready · {failed} failed', { ready: d.documents_by_status.ready || 0, failed: d.documents_by_status.failed || 0 }), u.documents, L.max_documents)}
      ${stat('Members', `${fmt.num(u.members)} <small>/ ${fmt.num(L.max_members)}</small>`, 'users', '', u.members, L.max_members)}
      ${stat('Questions this month', `${fmt.num(u.questions_this_month)} <small>/ ${fmt.num(L.max_questions_per_month)}</small>`, 'chat', '', u.questions_this_month, L.max_questions_per_month)}
      ${stat('Size', `${fmt.mb(u.storage_mb)} <small>/ ${fmt.num(L.max_storage_mb)} MB</small>`, 'db', t('{n} chunks indexed', { n: fmt.num(u.chunks) }), u.storage_mb, L.max_storage_mb)}
      ${stat('OCR pages', `${fmt.num(u.ocr_pages_this_month)} <small>/ ${fmt.num(L.max_ocr_pages_per_month)}</small>`, 'scan', 'this month', u.ocr_pages_this_month, L.max_ocr_pages_per_month)}
    </div>

    <div class="card">
      <div class="card-head"><h2>${esc(t('Questions over the last 30 days'))}</h2><span class="sub">${esc(t('{n} questions total', { n: fmt.num(d.questions_series.reduce((s, x) => s + x.questions, 0)) }))}</span></div>
      <div class="card-body"><div id="chart"></div></div>
    </div>

    <div class="split" style="grid-template-columns:1fr 1fr">
      <div class="card">
        <div class="card-head"><h3>Latest documents</h3><a href="#documents" class="small">View all</a></div>
        <div class="card-body flush">${d.recent_documents.length ? `<div class="table-wrap"><table class="tbl"><tbody>
          ${d.recent_documents.map((x) => `<tr><td><div class="cell-main truncate">${esc(x.filename)}</div><div class="cell-sub">${esc(fmt.ago(x.created_at))}</div></td><td style="width:1%">${badge(x.status, LABEL.status)}</td></tr>`).join('')}
        </tbody></table></div>` : emptyState(t('No documents yet'))}</div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Recent questions</h3><a href="#history" class="small">View all</a></div>
        <div class="card-body flush">${d.recent_chats.length ? `<div class="table-wrap"><table class="tbl"><tbody>
          ${d.recent_chats.map((x) => `<tr><td><div class="cell-main truncate">${esc(x.question)}</div><div class="cell-sub">${esc(x.user_email || '')} · ${esc(fmt.ago(x.created_at))}</div></td></tr>`).join('')}
        </tbody></table></div>` : emptyState(t('No questions yet'))}</div>
      </div>
    </div>`;

  renderBars(document.getElementById('chart'), d.questions_series, 'questions');
}

/* =================== DOCUMENTS & FOLDERS =================== */
async function viewDocuments() {
  const el = document.getElementById('view-documents');
  el.innerHTML = `
    <div class="split">
      <div class="card" style="margin:0">
        <div class="card-head"><h3>Folders</h3><button class="icon-btn" id="addFolder" title="${esc(t('Add folder'))}">${icon.plus}</button></div>
        <div class="card-body" id="tree">Loading…</div>
      </div>
      <div>
        <div class="toolbar">
          <div class="search-box">${icon.search}<input type="search" id="docSearch" placeholder="Search by file name…" /></div>
          <span class="spacer"></span>
          <button class="btn primary" id="uploadBtn">${icon.upload} Upload documents</button>
        </div>
        <div class="card"><div class="card-body flush" id="docTable">Loading…</div></div>
      </div>
    </div>`;

  document.getElementById('addFolder').onclick = () => folderModal();
  document.getElementById('uploadBtn').onclick = uploadModal;
  document.getElementById('docSearch').oninput = debounce((e) => loadDocs(e.target.value), 350);

  await loadFolders();
  await loadDocs();
}

async function loadFolders() {
  const res = await api(`/orgs/${orgId}/folders`);
  state.folders = res.folders; state.unfiled = res.unfiled_count;
  const total = state.folders.reduce((s, f) => s + f.document_count, 0) + res.unfiled_count;

  const roots = state.folders.filter((f) => !f.parent_id);
  const row = (f, depth) => `
    <div class="tree-item ${state.folder === f.id ? 'active' : ''}" data-folder="${esc(f.id)}" style="padding-left:${10 + depth * 14}px">
      ${icon.folder}<span class="name">${esc(f.name)}</span>
      ${f.visibility === 'private' ? `<span class="lock" title="${esc(t('Private — {n} people can read', { n: f.permission_count }))}">${icon.lock}</span>` : ''}
      <span class="count">${f.document_count}</span>
      <span class="row-act">
        <button class="icon-btn" data-edit="${esc(f.id)}" title="Edit folder and access">${icon.edit}</button>
        <button class="icon-btn" data-del="${esc(f.id)}" title="Delete">${icon.trash}</button>
      </span>
    </div>
    ${state.folders.filter((c) => c.parent_id === f.id).map((c) => row(c, depth + 1)).join('')}`;

  document.getElementById('tree').innerHTML = `
    <div class="tree">
      <div class="tree-item ${state.folder === null ? 'active' : ''}" data-folder="">${icon.inbox}<span class="name">All documents</span><span class="count">${total}</span></div>
      ${roots.map((f) => row(f, 0)).join('')}
      <div class="tree-item ${state.folder === 'none' ? 'active' : ''}" data-folder="none">${icon.file}<span class="name">Unfiled</span><span class="count">${state.unfiled}</span></div>
    </div>`;

  document.querySelectorAll('[data-folder]').forEach((n) => {
    n.onclick = (e) => {
      if (e.target.closest('[data-edit],[data-del]')) return;
      state.folder = n.dataset.folder || null;
      loadFolders(); loadDocs();
    };
  });
  document.querySelectorAll('[data-edit]').forEach((b) => {
    b.onclick = () => folderModal(state.folders.find((f) => f.id === b.dataset.edit));
  });
  document.querySelectorAll('[data-del]').forEach((b) => {
    b.onclick = async () => {
      const f = state.folders.find((x) => x.id === b.dataset.del);
      if (!(await confirmDialog(t('Delete folder'), t('Delete "{name}"? Files inside move to Unfiled — nothing is lost.', { name: f.name })))) return;
      try {
        await api(`/orgs/${orgId}/folders/${f.id}`, { method: 'DELETE' });
      } catch (err) {
        // A private folder that still holds documents: the server asks to confirm twice.
        if (!/needs_confirmation/.test(err.message)) throw err;
        const ok = await confirmDialog(
          t('Warning: these documents will become public'),
          t('"{name}" is private. Deleting it moves its files to Unfiled, where EVERY member of the organization can ask about them. Continue?', { name: f.name }),
          t('Delete anyway')
        );
        if (!ok) return;
        await api(`/orgs/${orgId}/folders/${f.id}?confirm=move-to-public`, { method: 'DELETE' });
      }
      toast(t('Folder deleted'), 'ok');
      state.folder = null; loadFolders(); loadDocs();
    };
  });
}

async function folderModal(folder) {
  // Load the member list together with the folder's current grants.
  let members = [];
  let granted = [];
  try {
    if (folder) {
      const d = await api(`/orgs/${orgId}/folders/${folder.id}/permissions`);
      members = d.members; granted = d.emails;
    } else {
      members = await api(`/orgs/${orgId}/members`);
    }
  } catch (err) { toast(err.message, 'err'); return; }

  const grantedSet = new Set(granted);
  const opts = state.folders.filter((f) => f.id !== folder?.id)
    .map((f) => `<option value="${esc(f.id)}" ${folder?.parent_id === f.id ? 'selected' : ''}>${esc(f.name)}${f.visibility === 'private' ? t(' (private)') : ''}</option>`).join('');

  const memberRows = members
    .filter((m) => m.role !== 'admin')
    .map((m) => `
      <label class="perm-row">
        <input type="checkbox" class="perm-check" value="${esc(String(m.email).toLowerCase())}" ${grantedSet.has(String(m.email).toLowerCase()) ? 'checked' : ''} />
        <span class="who"><b>${esc(m.full_name || String(m.email).split('@')[0])}</b><span>${esc(m.email)}</span></span>
        ${m.status === 'invited' ? `<span class="badge tiny warn">${esc(t('invited'))}</span>` : ''}
      </label>`).join('');

  const adminCount = members.filter((m) => m.role === 'admin').length;

  modal({
    title: folder ? t('Folder: {name}', { name: folder.name }) : t('New folder'),
    wide: true,
    okText: folder ? t('Save changes') : t('Create folder'),
    body: `
      <div class="form-grid">
        <div class="field"><label>Folder name</label><input type="text" id="fname" value="${esc(folder?.name || '')}" placeholder="${esc(t('e.g. HR procedures'))}" /></div>
        <div class="field"><label>Parent folder</label><select id="fparent"><option value="">${esc(t('— None —'))}</option>${opts}</select></div>
      </div>

      <div class="field">
        <label>Access</label>
        <label class="perm-row"><input type="radio" name="fvis" value="public" ${folder?.visibility !== 'private' ? 'checked' : ''} />
          <span class="who"><b>Public within the organization</b><span>Every member can ask the chatbot about files in this folder</span></span></label>
        <label class="perm-row"><input type="radio" name="fvis" value="private" ${folder?.visibility === 'private' ? 'checked' : ''} />
          <span class="who"><b>Private</b><span>Only the people selected below can ask. Others never see this folder and the chatbot will not read from it.</span></span></label>
      </div>

      <div class="field ${folder?.visibility === 'private' ? '' : 'hidden'}" id="permBlock">
        <label>Who can ask about files in this folder?</label>
        <div class="perm-list">${memberRows || `<div class="empty" style="padding:20px"><b>${esc(t('No regular members yet'))}</b><div>${esc(t('Invite members before granting access.'))}</div></div>`}</div>
        <div class="hint">${esc(t('The {n} organization admins can always read every folder, so they are not listed here.', { n: adminCount }))}</div>
        <div class="row mt-1" style="gap:8px">
          <button type="button" class="btn sm" id="permAll">Select all</button>
          <button type="button" class="btn sm" id="permNone">Clear all</button>
        </div>
      </div>

      <div class="alert info show" id="inheritNote" style="display:none">
        Subfolders of a private folder inherit the restriction — access requires permission on every private parent folder.
      </div>`,
    onOk: async (box) => {
      const name = box.querySelector('#fname').value.trim();
      if (!name) { toast(t('Please enter a folder name'), 'err'); return false; }

      const visibility = box.querySelector('input[name="fvis"]:checked').value;
      const emails = [...box.querySelectorAll('.perm-check:checked')].map((c) => c.value);

      if (visibility === 'private' && emails.length === 0) {
        const ok = await confirmDialog(
          t('Private folder with nobody selected'),
          t('You have not selected anyone. Only admins will be able to read this folder. Continue?'),
          t('Save anyway')
        );
        if (!ok) return false;
      }

      const body = { name, parent_id: box.querySelector('#fparent').value || null, visibility, emails };
      const res = folder
        ? await api(`/orgs/${orgId}/folders/${folder.id}`, { method: 'PATCH', body })
        : await api(`/orgs/${orgId}/folders`, { method: 'POST', body });

      if (res.permissions?.rejected?.length) {
        toast(t('Skipped {n} email(s) not in this organization', { n: res.permissions.rejected.length }), 'err');
      }
      toast(t('Folder saved'), 'ok');
      loadFolders();
    },
  });

  // Show the per-email grant list only while the folder is private.
  const sync = () => {
    const isPrivate = document.querySelector('input[name="fvis"]:checked')?.value === 'private';
    document.getElementById('permBlock')?.classList.toggle('hidden', !isPrivate);
    const note = document.getElementById('inheritNote');
    if (note) note.style.display = isPrivate ? 'block' : 'none';
  };
  document.querySelectorAll('input[name="fvis"]').forEach((r) => (r.onchange = sync));
  sync();

  const setAll = (v) => document.querySelectorAll('.perm-check').forEach((c) => (c.checked = v));
  const allBtn = document.getElementById('permAll');
  const noneBtn = document.getElementById('permNone');
  if (allBtn) allBtn.onclick = () => setAll(true);
  if (noneBtn) noneBtn.onclick = () => setAll(false);
}

function uploadModal() {
  const opts = state.folders.map((f) => `<option value="${esc(f.id)}" ${state.folder === f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('');
  modal({
    title: t('Upload documents'),
    okText: t('Upload'),
    body: `
      <div class="field"><label>Choose a folder</label><select id="ufolder"><option value="">${esc(t('Unfiled'))}</option>${opts}</select></div>
      <div class="field"><label>Files</label><input type="file" id="ufile" multiple accept=".pdf,.docx,.txt" />
        <div class="hint">${esc(t('Supports PDF (including scans — text is recognised automatically), DOCX and TXT. Max 25 MB per file.'))}<br>${esc(t('Scanned PDFs take longer and count towards the OCR page quota on your plan.'))}</div></div>
      <div id="uprogress" class="small muted"></div>`,
    onOk: async (box) => {
      const files = [...box.querySelector('#ufile').files];
      if (!files.length) { toast(t('No file selected'), 'err'); return false; }
      const folderId = box.querySelector('#ufolder').value;
      const pg = box.querySelector('#uprogress');
      let ok = 0, fail = 0;
      for (const [i, file] of files.entries()) {
        pg.textContent = t('Uploading {i}/{total}: {name}…', { i: i + 1, total: files.length, name: file.name });
        const fd = new FormData();
        fd.append('file', file);
        if (folderId) fd.append('folder_id', folderId);
        try { await api(`/orgs/${orgId}/documents`, { method: 'POST', form: fd }); ok++; }
        catch (err) { fail++; toast(`${file.name}: ${err.message}`, 'err'); }
      }
      toast(t('Uploaded {ok} file(s)', { ok }) + (fail ? t(', {n} failed', { n: fail }) : ''), fail ? 'err' : 'ok');
      loadFolders(); loadDocs();
    },
  });
}

let docTimer = null;
async function loadDocs(q = '') {
  clearTimeout(docTimer);
  const box = document.getElementById('docTable');
  if (!box) return;
  const params = new URLSearchParams();
  if (state.folder) params.set('folder_id', state.folder);
  if (q) params.set('q', q);

  const docs = await api(`/orgs/${orgId}/documents?${params}`);
  if (!docs.length) {
    box.innerHTML = emptyState(t('No documents yet'), t('Click "Upload documents" to add your first file.'));
    return;
  }

  const folderCell = (id) => {
    const f = state.folders.find((x) => x.id === id);
    if (!f) return `<span class="muted">${esc(t('Unfiled'))}</span>`;
    return `${esc(f.name)}${f.visibility === 'private' ? ` <span class="lock" title="${esc(t('Private folder'))}">${icon.lock}</span>` : ''}`;
  };
  box.innerHTML = `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>Documents</th><th>Folders</th><th class="num">Size</th><th class="num">Chunks</th><th>Status</th><th>Upload</th><th></th></tr></thead>
    <tbody>${docs.map((d) => `
      <tr>
        <td><div class="cell-main truncate" style="max-width:280px" title="${esc(d.filename)}">${esc(d.filename)}</div>
            <div class="cell-sub">${esc(d.uploader)}</div>
            ${d.error_message ? `<div class="cell-sub" style="color:var(--danger)">${esc(d.error_message)}</div>` : ''}</td>
        <td class="small">${folderCell(d.folder_id)}</td>
        <td class="num small">${esc(fmt.bytes(d.size_bytes))}</td>
        <td class="num small">${fmt.num(d.chunk_count)}</td>
        <td>${badge(d.status, LABEL.status)}
            ${d.status === 'ocr_retry' && d.next_retry_at ? `<div class="cell-sub">${esc(t('Retrying {when}', { when: fmt.until(d.next_retry_at) }))}</div>` : ''}
            ${d.extraction_method === 'ocr' && d.ocr_pages ? `<div class="cell-sub">${icon.scan} ${esc(t('OCR {n} pages', { n: fmt.num(d.ocr_pages) }))}</div>` : ''}</td>
        <td class="small nowrap">${esc(fmt.ago(d.created_at))}</td>
        <td class="nowrap" style="width:1%">
          <button class="icon-btn" data-dl="${esc(d.id)}" title="Download">${icon.download}</button>
          <button class="icon-btn" data-mv="${esc(d.id)}" title="Move to folder">${icon.folder}</button>
          ${d.status === 'failed' || d.status === 'ocr_retry' ? `<button class="icon-btn" data-re="${esc(d.id)}" title="Run again now">${icon.refresh}</button>` : ''}
          <button class="icon-btn" data-rm="${esc(d.id)}" title="Delete">${icon.trash}</button>
        </td>
      </tr>`).join('')}</tbody></table></div>`;

  box.querySelectorAll('[data-dl]').forEach((b) => {
    b.onclick = async () => {
      const { url } = await api(`/orgs/${orgId}/documents/${b.dataset.dl}/download`);
      window.open(url, '_blank');
    };
  });
  box.querySelectorAll('[data-mv]').forEach((b) => {
    b.onclick = () => {
      const d = docs.find((x) => x.id === b.dataset.mv);
      modal({
        title: t('Move to folder'),
        body: `<div class="field"><label>${esc(t('Destination folder for "{name}"', { name: d.filename }))}</label>
          <select id="mvf"><option value="">${esc(t('Unfiled'))}</option>
          ${state.folders.map((f) => `<option value="${esc(f.id)}" ${d.folder_id === f.id ? 'selected' : ''}>${esc(f.name)}${f.visibility === 'private' ? t(' (private)') : ''}</option>`).join('')}</select></div>
          <div class="hint">${esc(t('Moving to Unfiled means every member of the organization can ask about this document.'))}</div>`,
        onOk: async (box2) => {
          await api(`/orgs/${orgId}/documents/${d.id}`, { method: 'PATCH', body: { folder_id: box2.querySelector('#mvf').value || null } });
          toast(t('Moved to folder'), 'ok'); loadFolders(); loadDocs();
        },
      });
    };
  });
  box.querySelectorAll('[data-re]').forEach((b) => {
    b.onclick = async () => {
      await api(`/orgs/${orgId}/documents/${b.dataset.re}/reindex`, { method: 'POST' });
      toast(t('Reprocessing the document'), 'ok'); loadDocs();
    };
  });
  box.querySelectorAll('[data-rm]').forEach((b) => {
    b.onclick = async () => {
      const d = docs.find((x) => x.id === b.dataset.rm);
      if (!(await confirmDialog(t('Delete document'), t('Permanently delete "{name}"? The chatbot will no longer use it.', { name: d.filename })))) return;
      await api(`/orgs/${orgId}/documents/${d.id}`, { method: 'DELETE' });
      toast(t('Document deleted'), 'ok'); loadFolders(); loadDocs();
    };
  });

  // Poll faster while something is processing, slower while waiting on a retry.
  const has = (st) => docs.some((d) => d.status === st);
  let delay = 0;
  if (has('processing')) delay = 4000;
  else if (has('ocr_processing')) delay = 8000;
  else if (has('ocr_retry')) delay = 30000;
  if (delay) docTimer = setTimeout(() => loadDocs(q), delay);
}

/* =================== MEMBERS =================== */
async function viewMembers() {
  const el = document.getElementById('view-members');
  el.innerHTML = `
    <div class="toolbar"><span class="spacer"></span><button class="btn primary" id="inviteBtn">${icon.plus} Invite member</button></div>
    <div class="card"><div class="card-body flush" id="memberTable">Loading…</div></div>
    <div class="card"><div class="card-body">
      <h3>How permissions work</h3>
      <p class="muted mt-1"><b>Admin</b> — upload, view and delete documents, manage folders, invite and remove members, and read the whole organization's chat history.</p>
      <p class="muted mb-0"><b>Member</b> — can chat with the bot and read their own history only. They never see the document list and cannot upload or delete anything.</p>
    </div></div>`;
  document.getElementById('inviteBtn').onclick = inviteModal;
  await loadMembers();
}

async function loadMembers() {
  const box = document.getElementById('memberTable');
  const members = await api(`/orgs/${orgId}/members`);
  box.innerHTML = `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>Members</th><th>Role</th><th>Status</th><th>Last sign-in</th><th></th></tr></thead>
    <tbody>${members.map((m) => `
      <tr>
        <td><div class="row" style="gap:10px">
          <div class="avatar" style="background:var(--primary-soft);color:var(--primary)">${esc((m.full_name || m.email)[0].toUpperCase())}</div>
          <div><div class="cell-main">${esc(m.full_name || m.email.split('@')[0])} ${m.is_owner ? `<span class="badge purple">${esc(t('Owner'))}</span>` : ''}</div>
          <div class="cell-sub">${esc(m.email)}</div></div></div></td>
        <td>${badge(m.role, LABEL.role)}</td>
        <td>${badge(m.status, LABEL.status)}${m.invite_token ? `<button class="btn sm mt-1" data-link="${esc(m.invite_token)}">Copy invite link</button>` : ''}</td>
        <td class="small">${esc(fmt.ago(m.last_login_at))}</td>
        <td class="nowrap" style="width:1%">
          ${m.is_owner ? '' : `<button class="icon-btn" data-edit="${esc(m.id)}" title="Change role">${icon.edit}</button>
          <button class="icon-btn" data-rm="${esc(m.id)}" title="Remove from organization">${icon.trash}</button>`}
        </td>
      </tr>`).join('')}</tbody></table></div>`;

  box.querySelectorAll('[data-link]').forEach((b) => {
    b.onclick = () => {
      const url = `${location.origin}/register.html?invite=${b.dataset.link}`;
      navigator.clipboard.writeText(url).then(() => toast(t('Invite link copied'), 'ok'), () => prompt(t('Copy this link:'), url));
    };
  });
  box.querySelectorAll('[data-edit]').forEach((b) => {
    b.onclick = () => {
      const m = members.find((x) => x.id === b.dataset.edit);
      modal({
        title: t('Change role'),
        body: `<div class="field"><label>${esc(t('Role for {email}', { email: m.email }))}</label>
          <select id="mrole"><option value="member" ${m.role === 'member' ? 'selected' : ''}>Member — chatbot only</option>
          <option value="admin" ${m.role === 'admin' ? 'selected' : ''}>Admin — manages documents and members</option></select></div>`,
        onOk: async (box2) => {
          await api(`/orgs/${orgId}/members/${m.id}`, { method: 'PATCH', body: { role: box2.querySelector('#mrole').value } });
          toast(t('Role updated'), 'ok'); loadMembers();
        },
      });
    };
  });
  box.querySelectorAll('[data-rm]').forEach((b) => {
    b.onclick = async () => {
      const m = members.find((x) => x.id === b.dataset.rm);
      if (!(await confirmDialog(t('Remove member'), t('Remove {email} from the organization? They will lose access to the chatbot.', { email: m.email }), t('Remove')))) return;
      await api(`/orgs/${orgId}/members/${m.id}`, { method: 'DELETE' });
      toast(t('Member removed'), 'ok'); loadMembers();
    };
  });
}

function inviteModal() {
  modal({
    title: t('Invite member'),
    okText: t('Send invitation'),
    body: `
      <div class="field"><label>Email</label><input type="email" id="iemail" placeholder="teammate@company.com" /></div>
      <div class="field"><label>Role</label>
        <select id="irole"><option value="member">Member — chatbot only</option><option value="admin">Admin — manages documents and members</option></select></div>
      <div class="alert info show">${esc(t('If the email has no account yet, an invite link is created for you to send them.'))}</div>`,
    onOk: async (box) => {
      const email = box.querySelector('#iemail').value.trim();
      if (!email) { toast(t('Please enter an email'), 'err'); return false; }
      const res = await api(`/orgs/${orgId}/members`, { method: 'POST', body: { email, role: box.querySelector('#irole').value } });
      loadMembers();
      if (res.invite_link) {
        const url = location.origin + res.invite_link;
        modal({ title: t('Invite link ready'), okText: t('Copy link'), cancelText: t('Close'),
          body: `<p>${esc(t('Send the link below to {email} so they can create an account and join:', { email }))}</p>
                 <div class="field"><input type="text" readonly value="${esc(url)}" /></div>`,
          onOk: () => navigator.clipboard.writeText(url).then(() => toast(t('Copied'), 'ok')) });
      } else {
        toast(t('Member added to the organization'), 'ok');
      }
    },
  });
}

/* =================== CHAT HISTORY =================== */
async function viewHistory() {
  const el = document.getElementById('view-history');
  el.innerHTML = `
    <div class="toolbar"><div class="search-box">${icon.search}<input type="search" id="hq" placeholder="Search questions…" /></div></div>
    <div class="card"><div class="card-body flush" id="histBox">Loading…</div><div class="pager" id="histPager"></div></div>`;
  document.getElementById('hq').oninput = debounce(() => { state.historyPage = 1; loadHistory(); }, 350);
  await loadHistory();
}

async function loadHistory() {
  const box = document.getElementById('histBox');
  const q = document.getElementById('hq')?.value || '';
  const res = await api(`/orgs/${orgId}/chat/history?page=${state.historyPage}&size=25&q=${encodeURIComponent(q)}`);

  if (!res.items.length) { box.innerHTML = emptyState(t('No questions yet')); document.getElementById('histPager').innerHTML = ''; return; }

  box.innerHTML = `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>Question</th><th>Asked by</th><th class="num">Sources</th><th class="num">Response time</th><th>When</th></tr></thead>
    <tbody>${res.items.map((m, i) => `
      <tr data-row="${i}" style="cursor:pointer">
        <td><div class="cell-main truncate" style="max-width:420px">${esc(m.question)}</div>
            <div class="cell-sub truncate" style="max-width:420px">${esc((m.answer || '').slice(0, 120))}</div></td>
        <td class="small">${esc(m.user_email || '—')}</td>
        <td class="num small">${(m.sources || []).length}</td>
        <td class="num small">${m.latency_ms ? (m.latency_ms / 1000).toFixed(1) + 's' : '—'}</td>
        <td class="small nowrap">${esc(fmt.dateTime(m.created_at))}</td>
      </tr>`).join('')}</tbody></table></div>`;

  box.querySelectorAll('[data-row]').forEach((tr) => {
    tr.onclick = () => {
      const m = res.items[+tr.dataset.row];
      modal({ title: t('Conversation detail'), wide: true, okText: t('Close'), cancelText: t('Close'),
        body: `<div class="field"><label>Question</label><div>${esc(m.question)}</div></div>
               <div class="field"><label>Answer</label><div style="white-space:pre-wrap">${esc(m.answer || '')}</div></div>
               <div class="field"><label>Source documents</label><div class="srcs">${(m.sources || []).map((s) => `<span class="src-chip">${icon.file}${esc(s)}</span>`).join('') || `<span class="muted">${esc(t('None'))}</span>`}</div></div>
               <div class="small muted">${esc(m.user_email || '')} · ${esc(fmt.dateTime(m.created_at))}</div>` });
    };
  });

  const pages = Math.ceil(res.total / res.size);
  document.getElementById('histPager').innerHTML = `
    <span>${esc(t('{total} questions · page {page}/{pages}', { total: fmt.num(res.total), page: res.page, pages: pages || 1 }))}</span>
    <button class="btn sm" id="prev" ${res.page <= 1 ? 'disabled' : ''}>Previous</button>
    <button class="btn sm" id="next" ${res.page >= pages ? 'disabled' : ''}>Next</button>`;
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  if (prev) prev.onclick = () => { state.historyPage--; loadHistory(); };
  if (next) next.onclick = () => { state.historyPage++; loadHistory(); };
}

async function viewBilling() {
  const el = document.getElementById('view-billing');
  el.innerHTML = '<div class="loading-line"></div>';
  const b = await api(`/orgs/${orgId}/billing`);
  const u = b.usage, L = u.limits;
  
  const line = (label, used, limit, unit = '') => `
    <div class="mb-2">
      <div class="row between small"><span>${esc(label)}</span><span class="muted">${fmt.num(used)}${unit} / ${fmt.num(limit)}${unit}</span></div>
      ${meter(used, limit)}
    </div>`;

  el.innerHTML = `
    <div class="split" style="grid-template-columns:1fr 340px">
      <div>
        <div class="card">
          <div class="card-head"><h2>Usage</h2><span class="sub">${esc(t('Limits on the {name} plan', { name: b.plan?.name || '—' }))}</span></div>
          <div class="card-body">
            ${line('Documents', u.documents, L.max_documents)}
            ${line('Members', u.members, L.max_members)}
            ${line('Questions this month', u.questions_this_month, L.max_questions_per_month)}
            ${line('Storage used', u.storage_mb, L.max_storage_mb, ' MB')}
            ${line('Scanned PDF pages (OCR)', u.ocr_pages_this_month, L.max_ocr_pages_per_month)}
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h2>Payment history</h2></div>
          <div class="card-body flush">${b.payments.length ? `<div class="table-wrap"><table class="tbl">
            <thead><tr><th>Date</th><th>Period</th><th>Billed</th><th class="num">Amount</th><th>Method</th><th>Status</th><th>Invoice</th></tr></thead>
            <tbody>${b.payments.map((p) => `<tr>
              <td class="small">${esc(fmt.date(p.created_at))}</td>
              <td class="small">${esc(fmt.date(p.period_start))} → ${esc(fmt.date(p.period_end))}</td>
              <td class="small">${esc(p.billing_cycle === 'yearly' ? t('Yearly') : t('Monthly'))}</td>
              <td class="num">${esc(money(p.amount, p.currency || 'USD'))}</td>
              <td class="small">${esc(p.method || '—')}</td>
              <td>${badge(p.status, LABEL.payment)}</td>
              <td style="width:1%">${p.paid_at
                ? `<button class="btn sm" data-invoice="${esc(p.id)}">${icon.download} PDF</button>`
                : '<span class="muted small">—</span>'}</td></tr>`).join('')}</tbody></table></div>`
            : emptyState(t('No transactions yet'), t('This organization is on the free plan.'))}</div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="card-head"><h3>Current plan</h3></div>
          <div class="card-body">
            <div style="font-size:22px;font-weight:680">${esc(b.plan?.name || t('No plan assigned'))}</div>
            <div class="muted small">${esc(b.plan?.description || '')}</div>
            <div class="mt-2">${badge(b.billing_status, LABEL.billing)}</div>
            <div class="small muted mt-1">${esc(t('Valid until'))}: ${esc(b.plan_expires_at ? fmt.date(b.plan_expires_at) : t('unlimited'))}</div>
            ${b.trial?.isTrial && !b.trial.expired
              ? `<div class="alert warn show mt-1" style="background:var(--warn-soft);color:var(--warn)">${esc(t('{time} left in your trial', { time: fmt.duration(b.trial.msLeft) }))} — ${esc(t('all documents are deleted when it ends'))}</div>`
              : ''}
            ${b.trial?.expired
              ? `<div class="alert error show mt-1">${esc(b.trial.purged ? t('Your documents were deleted. Upgrade to start again.') : t('Upgrade now to keep your documents.'))}</div>`
              : ''}
            ${(() => {
              // Show the cycle this organization last paid on, not a generic
              // "/month" — an organization on a yearly plan that reads "$19
              // /month" next to a card charged $187 will open a support ticket.
              const last = b.payments.find((p) => p.paid_at);
              const onYear = last?.billing_cycle === 'yearly';
              const amount = onYear ? (b.plan?.price_usd_yearly || last.amount) : (b.plan?.price_usd || 0);
              return `<div class="mt-2" style="font-size:20px;font-weight:650">${esc(money(amount))}<span class="muted small"> ${esc(onYear ? t('/year') : t('/month'))}</span></div>`;
            })()}
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h3>Other plans</h3></div>
          <div class="card-body">
            ${b.available_plans.filter((p) => p.id !== b.plan?.id).map((p) => `
              <div class="mb-2" style="padding-bottom:12px;border-bottom:1px solid var(--border)">
                <div class="row between"><b>${esc(p.name)}</b><span>${esc(money(p.price_usd))}${esc(t('/month'))}</span></div>

                  : ''}
                <div class="small muted mb-1">${fmt.num(p.max_documents)} documents · ${fmt.num(p.max_members)} members · ${fmt.num(p.max_questions_per_month)} questions/month · ${fmt.num(p.max_ocr_pages_per_month || 0)} OCR pages/month</div>
                ${Number(p.price_usd) > 0 && b.providers?.length

            ${b.providers?.length
              ? `<p class="small muted mb-0">${esc(t('Your plan activates as soon as the payment arrives.'))}</p>`
              : `<p class="small muted mb-0">${esc(t('No payment gateway is enabled on the server. Contact the system administrator to change plan.'))}</p>`}
          </div>
        </div>
      </div>
    </div>`;

  el.querySelectorAll('[data-invoice]').forEach((btn) => {
    btn.onclick = async () => {
      const original = btn.innerHTML;
      btn.disabled = true; btn.textContent = t('Preparing…');
      try {
        await downloadFile(`/orgs/${orgId}/billing/payments/${btn.dataset.invoice}/invoice.pdf`, 'invoice.pdf');
      } catch (err) { toast(err.message, 'err'); }
      btn.disabled = false; btn.innerHTML = original;
    };
  });

  el.querySelectorAll('[data-buy]').forEach((btn) => {
    btn.onclick = () => startCheckout(b, btn.dataset.buy);
  });
}

/** Pick a payment method, then hand off to the gateway's checkout page. */
function startCheckout(billing, planId) {
  const plan = billing.available_plans.find((p) => p.id === planId);
  const providers = billing.providers || [];

  // The cycle lives in the modal, not on the page behind it: an admin who is
  // already looking at a total should be able to see it change rather than
  // close the dialog, flip something and come back.
  const cycleRow = plan.has_yearly ? `
      <div class="field">
        <label>${esc(t('Billing'))}</label>
        ${[
          { id: 'monthly', name: t('Monthly'), price: plan.price_usd, note: t('Renews every month. Cancel any time.') },
          { id: 'yearly', name: t('Yearly'), price: plan.price_yearly, note: t('Paid once for 12 months — save {n}%', { n: plan.yearly_saving_pct }) },
        ].map((c) => `
          <label class="pay-method ${c.id === 'monthly' ? 'sel' : ''}" data-cyc="${esc(c.id)}">
            <input type="radio" name="cyc" value="${esc(c.id)}" ${c.id === 'monthly' ? 'checked' : ''} />
            <span class="who"><b>${esc(c.name)} — ${esc(money(c.price))}</b><span>${esc(c.note)}</span></span>
          </label>`).join('')}
      </div>` : '';

  modal({
    title: t('Upgrade to {name}', { name: plan.name }),
    okText: t('Continue to payment'),
    body: `
      ${cycleRow}
      <div class="field">
        <label>Payment method</label>
        ${providers.map((p, i) => `
          <label class="pay-method ${i === 0 ? 'sel' : ''}" data-prov="1">
            <input type="radio" name="prov" value="${esc(p.id)}" ${i === 0 ? 'checked' : ''} ${providers.length === 1 ? 'hidden' : ''} />
            <span class="who"><b>${esc(p.name)}</b><span>${esc(p.description)}</span></span>
          </label>`).join('')}
      </div>
      <div class="row between" style="padding-top:10px;border-top:1px solid var(--border)">
        <b id="ckLabel"></b><b style="font-size:18px" id="ckTotal"></b>
      </div>
      <p class="small muted mt-1 mb-0" id="ckNote"></p>`,
    onOk: async (box) => {
      const provider = box.querySelector('input[name="prov"]:checked').value;
      const cycle = box.querySelector('input[name="cyc"]:checked')?.value || 'monthly';
      const res = await api(`/orgs/${orgId}/billing/checkout`, {
        method: 'POST',
        body: { plan_id: planId, provider, billing_cycle: cycle },
      });
      location.href = res.checkout_url;
      return false;
    },
  });

  // Keep the total honest as the cycle changes. The amount charged still comes
  // from the plans table on the server — this only keeps the dialog from
  // showing one number while the customer is agreeing to another.
  const refresh = () => {
    const yearly = document.querySelector('input[name="cyc"]:checked')?.value === 'yearly';
    document.getElementById('ckLabel').textContent = yearly ? t('Total for 12 months') : t('Total for 1 month');
    document.getElementById('ckTotal').textContent = money(yearly ? plan.price_yearly : plan.price_usd);
    document.getElementById('ckNote').textContent = yearly
      ? t('If your current plan is still valid, twelve months are added to the remaining time.')
      : t('If your current plan is still valid, one month is added to the remaining time.');
  };
  refresh();

  // Each group highlights only its own rows; one shared selector would clear
  // the payment method every time the cycle was clicked.
  document.querySelectorAll('.pay-method').forEach((el2) => {
    el2.onclick = () => {
      const group = el2.dataset.cyc ? '[data-cyc]' : '[data-prov]';
      document.querySelectorAll(`.pay-method${group}`).forEach((x) => x.classList.remove('sel'));
      el2.classList.add('sel');
      refresh();
    };
  });
}
