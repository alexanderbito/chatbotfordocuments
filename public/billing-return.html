<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Payment result — BotClarify</title>
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
<div style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <div class="card" style="max-width:460px;width:100%;margin:0">
    <div class="card-body" id="box" style="text-align:center;padding:36px 28px">
      <div class="loading-line"></div>
      <p class="muted mt-2 mb-0">Checking your payment…</p>
    </div>
  </div>
</div>

<script type="module">
import {api, Session, requireSession, fmt, esc, icon, t, money} from '/assets/app.js';

const params = new URLSearchParams(location.search);
const paymentId = params.get('payment');
const cancelled = params.get('cancelled') === '1';
const box = document.getElementById('box');

const me = await requireSession();
const orgIds = me.organizations.map((o) => o.id);

function show(kind, title, detail, actions) {
  const color = kind === 'ok' ? 'var(--success)' : kind === 'err' ? 'var(--danger)' : 'var(--warn)';
  const bg = kind === 'ok' ? 'var(--success-soft)' : kind === 'err' ? 'var(--danger-soft)' : 'var(--warn-soft)';
  box.innerHTML = `
    <div style="width:52px;height:52px;border-radius:50%;background:${bg};color:${color};display:grid;place-items:center;margin:0 auto 16px">
      <span style="width:26px;height:26px;display:block">${kind === 'ok' ? icon.check : kind === 'err' ? icon.alert : icon.info}</span>
    </div>
    <h2>${esc(title)}</h2>
    <p class="muted mt-1">${detail}</p>
    <div class="btn-row mt-2" style="justify-content:center">${actions}</div>`;
}

const backBtns = '<a class="btn primary" href="/admin.html#billing">Back to billing</a><a class="btn" href="/pricing.html">See pricing</a>';

if (!paymentId) {
  show('err', 'Missing transaction details', 'This link is not valid.', backBtns);
} else if (cancelled) {
  show('warn', 'Payment cancelled', 'Nothing was charged. You can pick a plan again at any time.', backBtns);
} else {
  // Find which organization this payment belongs to.
  let orgId = null, payment = null;
  for (const id of orgIds) {
    try {
      payment = await api(`/orgs/${id}/billing/payments/${paymentId}`);
      orgId = id; break;
    } catch { /* try the next organization */ }
  }

  if (!payment) {
    show('err', 'Transaction not found', 'This transaction does not exist or does not belong to your organization.', backBtns);
  } else {
    // PayPal needs an explicit capture once the payer approves.
    if (payment.provider === 'paypal' && payment.status !== 'paid') {
      try { await api(`/orgs/${orgId}/billing/payments/${paymentId}/capture`, { method: 'POST' }); }
      catch (err) { console.error('capture:', err.message); }
    }

    // The webhook can land a moment after the redirect, so poll a few times.
    let tries = 0;
    const poll = async () => {
      tries++;
      try { payment = await api(`/orgs/${orgId}/billing/payments/${paymentId}`); } catch { /* keep the previous snapshot */ }

      if (payment.status === 'paid') {
        const amount = money(payment.amount);
        show('ok', 'Payment successful',
          `The <b>${esc(payment.plan?.name || '')}</b> plan is now active.<br>Amount paid: <b>${esc(amount)}</b>`,
          backBtns);
        return;
      }
      if (['failed', 'expired', 'cancelled'].includes(payment.status)) {
        show('err', 'Payment not completed', 'The transaction did not go through. You can try again.', backBtns);
        return;
      }
      if (tries >= 12) {
        show('warn', 'Still waiting for confirmation',
          'If you have already paid, this will update within a few minutes. Reload to check.',
          `<button class="btn primary" onclick="location.reload()">Check again</button>` + backBtns);
        return;
      }
      setTimeout(poll, 2500);
    };
    poll();
  }
}
</script>
</body>
</html>
