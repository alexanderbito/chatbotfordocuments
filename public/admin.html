<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quản trị doanh nghiệp — DocBot</title>
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
<div id="trialBar"></div>
<div class="shell" id="shell"></div>

<script type="module">
import {
  api, Session, requireSession, buildSidebar, logout, icon, esc, fmt, toast,
  modal, confirmDialog, emptyState, badge, LABEL, meter, renderBars, debounce, router,
  t, money, currency, preferredProvider, trialBanner, bindLangSwitcher, observeAndTranslate,
} from '/assets/app.js';

const me = await requireSession();
const adminOrgs = me.user.is_system_admin ? me.organizations : me.organizations.filter((o) => o.role === 'admin');
if (!adminOrgs.length) location.href = '/chat.html';

let orgId = adminOrgs.some((o) => o.id === Session.orgId) ? Session.orgId : adminOrgs[0].id;
Session.orgId = orgId;
let org = null;
let trial = adminOrgs.find((o) => o.id === orgId)?.trial || null;
let state = { folder: null, folders: [], unfiled: 0, historyPage: 1 };

const TITLES = {
  overview: ['Tổng quan', 'Bức tranh nhanh về tài liệu, thành viên và mức sử dụng.'],
  documents: ['Tài liệu & thư mục', 'Tải lên, sắp xếp và kiểm soát tài liệu được đưa vào chatbot.'],
  members: ['Thành viên', 'Mời đồng nghiệp và phân quyền sử dụng chatbot.'],
  history: ['Lịch sử hỏi đáp', 'Toàn bộ câu hỏi thành viên đã gửi và câu trả lời của chatbot.'],
  billing: ['Gói cước', 'Hạn mức đang dùng và lịch sử thanh toán.'],
  settings: ['Thiết lập', 'Hồ sơ doanh nghiệp và tài khoản của bạn.'],
};

function shell() {
  document.getElementById('shell').innerHTML = `
    ${buildSidebar({
      brandSub: 'Quản trị doanh nghiệp',
      user: me.user,
      orgs: adminOrgs,
      currentOrgId: orgId,
      items: [
        { group: 'Vận hành' },
        { view: 'overview', icon: 'dashboard', label: 'Tổng quan' },
        { view: 'documents', icon: 'folder', label: 'Tài liệu & thư mục' },
        { view: 'members', icon: 'users', label: 'Thành viên' },
        { view: 'history', icon: 'history', label: 'Lịch sử hỏi đáp' },
        { group: 'Tài khoản' },
        { view: 'billing', icon: 'card', label: 'Gói cước' },
        { view: 'settings', icon: 'settings', label: 'Thiết lập' },
      ],
    })}
    <div class="main">
      <div class="topbar">
        <div class="title"><h1 id="ttl">Tổng quan</h1><p id="dsc"></p></div>
        <a class="btn" href="/pricing.html">${icon.card} Bảng giá</a>
        <a class="btn" href="/chat.html">${icon.chat} Mở chatbot</a>
      </div>
      <div class="page">
        ${['overview', 'documents', 'members', 'history', 'billing', 'settings']
          .map((v) => `<section class="page-section" data-view="${v}" id="view-${v}"></section>`).join('')}
      </div>
    </div>`;

  bindLangSwitcher();
  observeAndTranslate();

  document.getElementById('logoutBtn').onclick = logout;
  document.getElementById('orgSwitch').onchange = (e) => { Session.orgId = e.target.value; location.reload(); };
}

/* =================== TỔNG QUAN =================== */
async function viewOverview() {
  const el = document.getElementById('view-overview');
  el.innerHTML = '<div class="loading-line"></div>';
  const d = await api(`/orgs/${orgId}/overview`);
  const u = d.usage, L = u.limits;

  const stat = (label, value, ic, foot, used, limit) => `
    <div class="stat">
      <div class="row between"><div class="label">${esc(label)}</div><div class="icon">${icon[ic]}</div></div>
      <div class="value">${value}</div>
      ${limit !== undefined ? meter(used, limit) : ''}
      ${foot ? `<div class="foot">${foot}</div>` : ''}
    </div>`;

  el.innerHTML = `
    <div class="stat-grid">
      ${stat('Tài liệu', `${fmt.num(u.documents)} <small>/ ${fmt.num(L.max_documents)}</small>`, 'file', `${d.documents_by_status.ready || 0} sẵn sàng · ${d.documents_by_status.failed || 0} lỗi`, u.documents, L.max_documents)}
      ${stat('Thành viên', `${fmt.num(u.members)} <small>/ ${fmt.num(L.max_members)}</small>`, 'users', '', u.members, L.max_members)}
      ${stat('Lượt hỏi tháng này', `${fmt.num(u.questions_this_month)} <small>/ ${fmt.num(L.max_questions_per_month)}</small>`, 'chat', '', u.questions_this_month, L.max_questions_per_month)}
      ${stat('Dung lượng', `${fmt.mb(u.storage_mb)} <small>/ ${fmt.num(L.max_storage_mb)} MB</small>`, 'db', `${fmt.num(u.chunks)} đoạn đã lập chỉ mục`, u.storage_mb, L.max_storage_mb)}
      ${stat('Trang nhận dạng (OCR)', `${fmt.num(u.ocr_pages_this_month)} <small>/ ${fmt.num(L.max_ocr_pages_per_month)}</small>`, 'scan', 'trong tháng này', u.ocr_pages_this_month, L.max_ocr_pages_per_month)}
    </div>

    <div class="card">
      <div class="card-head"><h2>Lượt hỏi 30 ngày gần nhất</h2><span class="sub">Tổng ${fmt.num(d.questions_series.reduce((s, x) => s + x.questions, 0))} câu hỏi</span></div>
      <div class="card-body"><div id="chart"></div></div>
    </div>

    <div class="split" style="grid-template-columns:1fr 1fr">
      <div class="card">
        <div class="card-head"><h3>Tài liệu mới nhất</h3><a href="#documents" class="small">Xem tất cả</a></div>
        <div class="card-body flush">${d.recent_documents.length ? `<div class="table-wrap"><table class="tbl"><tbody>
          ${d.recent_documents.map((x) => `<tr><td><div class="cell-main truncate">${esc(x.filename)}</div><div class="cell-sub">${esc(fmt.ago(x.created_at))}</div></td><td style="width:1%">${badge(x.status, LABEL.status)}</td></tr>`).join('')}
        </tbody></table></div>` : emptyState('Chưa có tài liệu nào')}</div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Câu hỏi gần đây</h3><a href="#history" class="small">Xem tất cả</a></div>
        <div class="card-body flush">${d.recent_chats.length ? `<div class="table-wrap"><table class="tbl"><tbody>
          ${d.recent_chats.map((x) => `<tr><td><div class="cell-main truncate">${esc(x.question)}</div><div class="cell-sub">${esc(x.user_email || '')} · ${esc(fmt.ago(x.created_at))}</div></td></tr>`).join('')}
        </tbody></table></div>` : emptyState('Chưa có câu hỏi nào')}</div>
      </div>
    </div>`;

  renderBars(document.getElementById('chart'), d.questions_series, 'questions');
}

/* =================== TÀI LIỆU & THƯ MỤC =================== */
async function viewDocuments() {
  const el = document.getElementById('view-documents');
  el.innerHTML = `
    <div class="split">
      <div class="card" style="margin:0">
        <div class="card-head"><h3>Thư mục</h3><button class="icon-btn" id="addFolder" title="Thêm thư mục">${icon.plus}</button></div>
        <div class="card-body" id="tree" data-no-i18n>Đang tải…</div>
      </div>
      <div>
        <div class="toolbar">
          <div class="search-box">${icon.search}<input type="search" id="docSearch" placeholder="Tìm theo tên tài liệu…" /></div>
          <span class="spacer"></span>
          <button class="btn primary" id="uploadBtn">${icon.upload} Tải tài liệu lên</button>
        </div>
        <div class="card"><div class="card-body flush" id="docTable" data-no-i18n>Đang tải…</div></div>
      </div>
    </div>`;

  document.getElementById('addFolder').onclick = () => folderModal();
  document.getElementById('uploadBtn').onclick = uploadModal;
  document.getElementById('docSearch').oninput = debounce((e) => loadDocs(e.target.value), 350);

  await loadFolders();
  await loadDocs();
}

async function loadFolders() {
  const res = await api(`/orgs/${orgId}/folders`);
  state.folders = res.folders; state.unfiled = res.unfiled_count;
  const total = state.folders.reduce((s, f) => s + f.document_count, 0) + res.unfiled_count;

  const roots = state.folders.filter((f) => !f.parent_id);
  const row = (f, depth) => `
    <div class="tree-item ${state.folder === f.id ? 'active' : ''}" data-folder="${esc(f.id)}" style="padding-left:${10 + depth * 14}px">
      ${icon.folder}<span class="name">${esc(f.name)}</span>
      ${f.visibility === 'private' ? `<span class="lock" title="Riêng tư — ${f.permission_count} người được đọc">${icon.lock}</span>` : ''}
      <span class="count">${f.document_count}</span>
      <span class="row-act">
        <button class="icon-btn" data-edit="${esc(f.id)}" title="Sửa thư mục và quyền">${icon.edit}</button>
        <button class="icon-btn" data-del="${esc(f.id)}" title="Xoá">${icon.trash}</button>
      </span>
    </div>
    ${state.folders.filter((c) => c.parent_id === f.id).map((c) => row(c, depth + 1)).join('')}`;

  document.getElementById('tree').innerHTML = `
    <div class="tree">
      <div class="tree-item ${state.folder === null ? 'active' : ''}" data-folder="">${icon.inbox}<span class="name">Tất cả tài liệu</span><span class="count">${total}</span></div>
      ${roots.map((f) => row(f, 0)).join('')}
      <div class="tree-item ${state.folder === 'none' ? 'active' : ''}" data-folder="none">${icon.file}<span class="name">Chưa phân loại</span><span class="count">${state.unfiled}</span></div>
    </div>`;

  document.querySelectorAll('[data-folder]').forEach((n) => {
    n.onclick = (e) => {
      if (e.target.closest('[data-edit],[data-del]')) return;
      state.folder = n.dataset.folder || null;
      loadFolders(); loadDocs();
    };
  });
  document.querySelectorAll('[data-edit]').forEach((b) => {
    b.onclick = () => folderModal(state.folders.find((f) => f.id === b.dataset.edit));
  });
  document.querySelectorAll('[data-del]').forEach((b) => {
    b.onclick = async () => {
      const f = state.folders.find((x) => x.id === b.dataset.del);
      if (!(await confirmDialog('Xoá thư mục', `Xoá "${f.name}"? Tài liệu bên trong sẽ chuyển về mục Chưa phân loại, không bị mất.`))) return;
      try {
        await api(`/orgs/${orgId}/folders/${f.id}`, { method: 'DELETE' });
      } catch (err) {
        // Thư mục riêng tư còn tài liệu -> backend bắt xác nhận lần nữa
        if (!/needs_confirmation/.test(err.message)) throw err;
        const ok = await confirmDialog(
          'Cảnh báo: tài liệu sẽ thành công khai',
          `"${f.name}" đang ở chế độ riêng tư. Xoá thư mục sẽ đẩy tài liệu bên trong về mục Chưa phân loại, ` +
          `và MỌI thành viên trong tổ chức sẽ hỏi được nội dung đó. Vẫn tiếp tục?`,
          'Vẫn xoá'
        );
        if (!ok) return;
        await api(`/orgs/${orgId}/folders/${f.id}?confirm=move-to-public`, { method: 'DELETE' });
      }
      toast('Đã xoá thư mục', 'ok');
      state.folder = null; loadFolders(); loadDocs();
    };
  });
}

async function folderModal(folder) {
  // Lấy danh sách thành viên và quyền hiện tại của thư mục
  let members = [];
  let granted = [];
  try {
    if (folder) {
      const d = await api(`/orgs/${orgId}/folders/${folder.id}/permissions`);
      members = d.members; granted = d.emails;
    } else {
      members = await api(`/orgs/${orgId}/members`);
    }
  } catch (err) { toast(err.message, 'err'); return; }

  const grantedSet = new Set(granted);
  const opts = state.folders.filter((f) => f.id !== folder?.id)
    .map((f) => `<option value="${esc(f.id)}" ${folder?.parent_id === f.id ? 'selected' : ''}>${esc(f.name)}${f.visibility === 'private' ? ' (riêng tư)' : ''}</option>`).join('');

  const memberRows = members
    .filter((m) => m.role !== 'admin')
    .map((m) => `
      <label class="perm-row">
        <input type="checkbox" class="perm-check" value="${esc(String(m.email).toLowerCase())}" ${grantedSet.has(String(m.email).toLowerCase()) ? 'checked' : ''} />
        <span class="who"><b>${esc(m.full_name || String(m.email).split('@')[0])}</b><span>${esc(m.email)}</span></span>
        ${m.status === 'invited' ? '<span class="badge tiny warn">chờ nhận lời mời</span>' : ''}
      </label>`).join('');

  const adminCount = members.filter((m) => m.role === 'admin').length;

  modal({
    title: folder ? `Thư mục: ${folder.name}` : 'Thư mục mới',
    wide: true,
    okText: folder ? 'Lưu thay đổi' : 'Tạo thư mục',
    body: `
      <div class="form-grid">
        <div class="field"><label>Tên thư mục</label><input type="text" id="fname" value="${esc(folder?.name || '')}" placeholder="Ví dụ: Quy trình nhân sự" /></div>
        <div class="field"><label>Thư mục cha</label><select id="fparent"><option value="">— Không có —</option>${opts}</select></div>
      </div>

      <div class="field">
        <label>Chế độ truy cập</label>
        <label class="perm-row"><input type="radio" name="fvis" value="public" ${folder?.visibility !== 'private' ? 'checked' : ''} />
          <span class="who"><b>Công khai trong tổ chức</b><span>Mọi thành viên đều hỏi chatbot được về tài liệu trong thư mục này</span></span></label>
        <label class="perm-row"><input type="radio" name="fvis" value="private" ${folder?.visibility === 'private' ? 'checked' : ''} />
          <span class="who"><b>Riêng tư</b><span>Chỉ những người được chọn bên dưới mới hỏi được. Người khác không thấy thư mục và chatbot không đọc tài liệu bên trong.</span></span></label>
      </div>

      <div class="field ${folder?.visibility === 'private' ? '' : 'hidden'}" id="permBlock">
        <label>Ai được hỏi về tài liệu trong thư mục này?</label>
        <div class="perm-list">${memberRows || '<div class="empty" style="padding:20px"><b>Chưa có thành viên thường</b><div>Hãy mời thành viên trước khi phân quyền.</div></div>'}</div>
        <div class="hint">${adminCount} quản trị viên của tổ chức luôn đọc được mọi thư mục nên không cần chọn ở đây.</div>
        <div class="row mt-1" style="gap:8px">
          <button type="button" class="btn sm" id="permAll">Chọn tất cả</button>
          <button type="button" class="btn sm" id="permNone">Bỏ chọn tất cả</button>
        </div>
      </div>

      <div class="alert info show" id="inheritNote" style="display:none">
        Thư mục con nằm trong thư mục riêng tư cũng bị hạn chế theo — muốn đọc thư mục con thì phải có quyền ở tất cả thư mục cha riêng tư.
      </div>`,
    onOk: async (box) => {
      const name = box.querySelector('#fname').value.trim();
      if (!name) { toast('Chưa nhập tên thư mục', 'err'); return false; }

      const visibility = box.querySelector('input[name="fvis"]:checked').value;
      const emails = [...box.querySelectorAll('.perm-check:checked')].map((c) => c.value);

      if (visibility === 'private' && emails.length === 0) {
        const ok = await confirmDialog(
          'Thư mục riêng tư chưa có ai',
          'Bạn chưa chọn thành viên nào. Thư mục sẽ chỉ quản trị viên đọc được, thành viên thường không hỏi được gì trong đó. Tiếp tục?',
          'Vẫn lưu'
        );
        if (!ok) return false;
      }

      const body = { name, parent_id: box.querySelector('#fparent').value || null, visibility, emails };
      const res = folder
        ? await api(`/orgs/${orgId}/folders/${folder.id}`, { method: 'PATCH', body })
        : await api(`/orgs/${orgId}/folders`, { method: 'POST', body });

      if (res.permissions?.rejected?.length) {
        toast(`Bỏ qua ${res.permissions.rejected.length} email không thuộc tổ chức`, 'err');
      }
      toast('Đã lưu thư mục', 'ok');
      loadFolders();
    },
  });

  // Hiện/ẩn danh sách phân quyền theo chế độ đang chọn
  const sync = () => {
    const isPrivate = document.querySelector('input[name="fvis"]:checked')?.value === 'private';
    document.getElementById('permBlock')?.classList.toggle('hidden', !isPrivate);
    const note = document.getElementById('inheritNote');
    if (note) note.style.display = isPrivate ? 'block' : 'none';
  };
  document.querySelectorAll('input[name="fvis"]').forEach((r) => (r.onchange = sync));
  sync();

  const setAll = (v) => document.querySelectorAll('.perm-check').forEach((c) => (c.checked = v));
  const allBtn = document.getElementById('permAll');
  const noneBtn = document.getElementById('permNone');
  if (allBtn) allBtn.onclick = () => setAll(true);
  if (noneBtn) noneBtn.onclick = () => setAll(false);
}

function uploadModal() {
  const opts = state.folders.map((f) => `<option value="${esc(f.id)}" ${state.folder === f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('');
  modal({
    title: 'Tải tài liệu lên',
    okText: 'Tải lên',
    body: `
      <div class="field"><label>Chọn thư mục</label><select id="ufolder"><option value="">Chưa phân loại</option>${opts}</select></div>
      <div class="field"><label>Tệp tài liệu</label><input type="file" id="ufile" multiple accept=".pdf,.docx,.txt" />
        <div class="hint">Hỗ trợ PDF (kể cả bản scan — hệ thống tự nhận dạng chữ), DOCX và TXT. Tối đa 25 MB mỗi tệp.<br>PDF scan xử lý lâu hơn và tính vào hạn mức trang nhận dạng của gói.</div></div>
      <div id="uprogress" class="small muted"></div>`,
    onOk: async (box) => {
      const files = [...box.querySelector('#ufile').files];
      if (!files.length) { toast('Chưa chọn tệp', 'err'); return false; }
      const folderId = box.querySelector('#ufolder').value;
      const pg = box.querySelector('#uprogress');
      let ok = 0, fail = 0;
      for (const [i, file] of files.entries()) {
        pg.textContent = `Đang tải ${i + 1}/${files.length}: ${file.name}…`;
        const fd = new FormData();
        fd.append('file', file);
        if (folderId) fd.append('folder_id', folderId);
        try { await api(`/orgs/${orgId}/documents`, { method: 'POST', form: fd }); ok++; }
        catch (err) { fail++; toast(`${file.name}: ${err.message}`, 'err'); }
      }
      toast(`Đã tải lên ${ok} tệp${fail ? `, ${fail} tệp lỗi` : ''}`, fail ? 'err' : 'ok');
      loadFolders(); loadDocs();
    },
  });
}

let docTimer = null;
async function loadDocs(q = '') {
  clearTimeout(docTimer);
  const box = document.getElementById('docTable');
  if (!box) return;
  const params = new URLSearchParams();
  if (state.folder) params.set('folder_id', state.folder);
  if (q) params.set('q', q);

  const docs = await api(`/orgs/${orgId}/documents?${params}`);
  if (!docs.length) {
    box.innerHTML = emptyState('Chưa có tài liệu', 'Bấm "Tải tài liệu lên" để đưa tài liệu đầu tiên vào chatbot.');
    return;
  }

  const folderCell = (id) => {
    const f = state.folders.find((x) => x.id === id);
    if (!f) return '<span class="muted">Chưa phân loại</span>';
    return `${esc(f.name)}${f.visibility === 'private' ? ` <span class="lock" title="Thư mục riêng tư">${icon.lock}</span>` : ''}`;
  };
  box.innerHTML = `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>Tài liệu</th><th>Thư mục</th><th class="num">Dung lượng</th><th class="num">Số đoạn</th><th>Trạng thái</th><th>Tải lên</th><th></th></tr></thead>
    <tbody>${docs.map((d) => `
      <tr>
        <td><div class="cell-main truncate" style="max-width:280px" title="${esc(d.filename)}">${esc(d.filename)}</div>
            <div class="cell-sub">${esc(d.uploader)}</div>
            ${d.error_message ? `<div class="cell-sub" style="color:var(--danger)">${esc(d.error_message)}</div>` : ''}</td>
        <td class="small">${folderCell(d.folder_id)}</td>
        <td class="num small">${esc(fmt.bytes(d.size_bytes))}</td>
        <td class="num small">${fmt.num(d.chunk_count)}</td>
        <td>${badge(d.status, LABEL.status)}
            ${d.status === 'ocr_retry' && d.next_retry_at ? `<div class="cell-sub">Tự chạy lại ${esc(fmt.until(d.next_retry_at))}</div>` : ''}
            ${d.extraction_method === 'ocr' && d.ocr_pages ? `<div class="cell-sub">${icon.scan} OCR ${fmt.num(d.ocr_pages)} trang</div>` : ''}</td>
        <td class="small nowrap">${esc(fmt.ago(d.created_at))}</td>
        <td class="nowrap" style="width:1%">
          <button class="icon-btn" data-dl="${esc(d.id)}" title="Tải xuống">${icon.download}</button>
          <button class="icon-btn" data-mv="${esc(d.id)}" title="Chuyển thư mục">${icon.folder}</button>
          ${d.status === 'failed' || d.status === 'ocr_retry' ? `<button class="icon-btn" data-re="${esc(d.id)}" title="Chạy lại ngay">${icon.refresh}</button>` : ''}
          <button class="icon-btn" data-rm="${esc(d.id)}" title="Xoá">${icon.trash}</button>
        </td>
      </tr>`).join('')}</tbody></table></div>`;

  box.querySelectorAll('[data-dl]').forEach((b) => {
    b.onclick = async () => {
      const { url } = await api(`/orgs/${orgId}/documents/${b.dataset.dl}/download`);
      window.open(url, '_blank');
    };
  });
  box.querySelectorAll('[data-mv]').forEach((b) => {
    b.onclick = () => {
      const d = docs.find((x) => x.id === b.dataset.mv);
      modal({
        title: 'Chuyển thư mục',
        body: `<div class="field"><label>Thư mục đích cho "${esc(d.filename)}"</label>
          <select id="mvf"><option value="">Chưa phân loại</option>
          ${state.folders.map((f) => `<option value="${esc(f.id)}" ${d.folder_id === f.id ? 'selected' : ''}>${esc(f.name)}${f.visibility === 'private' ? ' (riêng tư)' : ''}</option>`).join('')}</select></div>
          <div class="hint">Chuyển vào "Chưa phân loại" nghĩa là mọi thành viên trong tổ chức đều hỏi được tài liệu này.</div>`,
        onOk: async (box2) => {
          await api(`/orgs/${orgId}/documents/${d.id}`, { method: 'PATCH', body: { folder_id: box2.querySelector('#mvf').value || null } });
          toast('Đã chuyển thư mục', 'ok'); loadFolders(); loadDocs();
        },
      });
    };
  });
  box.querySelectorAll('[data-re]').forEach((b) => {
    b.onclick = async () => {
      await api(`/orgs/${orgId}/documents/${b.dataset.re}/reindex`, { method: 'POST' });
      toast('Đang xử lý lại tài liệu', 'ok'); loadDocs();
    };
  });
  box.querySelectorAll('[data-rm]').forEach((b) => {
    b.onclick = async () => {
      const d = docs.find((x) => x.id === b.dataset.rm);
      if (!(await confirmDialog('Xoá tài liệu', `Xoá vĩnh viễn "${d.filename}"? Chatbot sẽ không còn dùng tài liệu này.`))) return;
      await api(`/orgs/${orgId}/documents/${d.id}`, { method: 'DELETE' });
      toast('Đã xoá tài liệu', 'ok'); loadFolders(); loadDocs();
    };
  });

  // Nhịp làm mới theo việc đang chạy: đang xử lý thì hỏi dày, chờ thử lại thì hỏi thưa
  const has = (st) => docs.some((d) => d.status === st);
  let delay = 0;
  if (has('processing')) delay = 4000;
  else if (has('ocr_processing')) delay = 8000;
  else if (has('ocr_retry')) delay = 30000;
  if (delay) docTimer = setTimeout(() => loadDocs(q), delay);
}

async function viewHistory() {
  const el = document.getElementById('view-history');
  el.innerHTML = `

async function loadHistory() {
  const box = document.getElementById('histBox');
  const q = document.getElementById('hq')?.value || '';
  const res = await api(`/orgs/${orgId}/chat/history?page=${state.historyPage}&size=25&q=${encodeURIComponent(q)}`);

  if (!res.items.length) { box.innerHTML = emptyState('Chưa có câu hỏi nào'); document.getElementById('histPager').innerHTML = ''; return; }

  box.innerHTML = `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>Câu hỏi</th><th>Người hỏi</th><th class="num">Nguồn</th><th class="num">Thời gian xử lý</th><th>Lúc</th></tr></thead>
    <tbody>${res.items.map((m, i) => `
      <tr data-row="${i}" style="cursor:pointer">
        <td><div class="cell-main truncate" style="max-width:420px">${esc(m.question)}</div>
            <div class="cell-sub truncate" style="max-width:420px">${esc((m.answer || '').slice(0, 120))}</div></td>
        <td class="small">${esc(m.user_email || '—')}</td>
        <td class="num small">${(m.sources || []).length}</td>
        <td class="num small">${m.latency_ms ? (m.latency_ms / 1000).toFixed(1) + 's' : '—'}</td>
        <td class="small nowrap">${esc(fmt.dateTime(m.created_at))}</td>
      </tr>`).join('')}</tbody></table></div>`;

  box.querySelectorAll('[data-row]').forEach((tr) => {
    tr.onclick = () => {
      const m = res.items[+tr.dataset.row];
      modal({ title: 'Chi tiết hỏi đáp', wide: true, okText: 'Đóng', cancelText: 'Đóng',
        body: `<div class="field"><label>Câu hỏi</label><div>${esc(m.question)}</div></div>
               <div class="field"><label>Trả lời</label><div style="white-space:pre-wrap">${esc(m.answer || '')}</div></div>
               <div class="field"><label>Nguồn tham chiếu</label><div class="srcs">${(m.sources || []).map((s) => `<span class="src-chip">${icon.file}${esc(s)}</span>`).join('') || '<span class="muted">Không có</span>'}</div></div>
               <div class="small muted">${esc(m.user_email || '')} · ${esc(fmt.dateTime(m.created_at))}</div>` });
    };
  });

  const pages = Math.ceil(res.total / res.size);
  document.getElementById('histPager').innerHTML = `
    <span>${fmt.num(res.total)} câu hỏi · trang ${res.page}/${pages || 1}</span>
    <button class="btn sm" id="prev" ${res.page <= 1 ? 'disabled' : ''}>Trước</button>
    <button class="btn sm" id="next" ${res.page >= pages ? 'disabled' : ''}>Sau</button>`;
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  if (prev) prev.onclick = () => { state.historyPage--; loadHistory(); };
  if (next) next.onclick = () => { state.historyPage++; loadHistory(); };
}

/** Mở hộp thoại chọn phương thức rồi chuyển sang trang thanh toán của cổng. */
function startCheckout(billing, planId, intl) {
  const plan = billing.available_plans.find((p) => p.id === planId);
  const wanted = preferredProvider();
  const providers = [...(billing.providers || [])].sort((a, b) => Number(b.id === wanted) - Number(a.id === wanted));
  const amount = money(intl ? plan.price_usd : plan.price_vnd, intl ? 'USD' : 'VND');

  modal({
    title: t('Nâng cấp lên gói {name}', { name: plan.name }),
    okText: 'Tiếp tục thanh toán',
    body: `
      <div class="field">
        <label>Phương thức thanh toán</label>
        ${providers.map((p, i) => `
          <label class="pay-method ${i === 0 ? 'sel' : ''}">
            <input type="radio" name="prov" value="${esc(p.id)}" ${i === 0 ? 'checked' : ''} />
            <span class="who"><b>${esc(t(p.name))}</b><span>${esc(t(p.description))}</span></span>
          </label>`).join('')}
      </div>
      <div class="row between" style="padding-top:10px;border-top:1px solid var(--border)">
        <b>Tổng thanh toán</b><b style="font-size:18px">${esc(amount)}</b>
      </div>
      <p class="small muted mt-1 mb-0">Nếu gói hiện tại còn hạn, thời gian còn lại được cộng dồn thêm 1 tháng.</p>`,
    onOk: async (box) => {
      const provider = box.querySelector('input[name="prov"]:checked').value;
      const res = await api(`/orgs/${orgId}/billing/checkout`, { method: 'POST', body: { plan_id: planId, provider } });
      location.href = res.checkout_url;
      return false;
    },
  });

  document.querySelectorAll('.pay-method').forEach((el2) => {
    el2.onclick = () => {
      document.querySelectorAll('.pay-method').forEach((x) => x.classList.remove('sel'));
      el2.classList.add('sel');
    };
  });
}

    try { await api('/auth/profile', { method: 'PATCH', body: { full_name: document.getElementById('uname').value.trim() } }); toast('Đã lưu hồ sơ', 'ok'); }
    catch (err) { toast(err.message, 'err'); }
  };
  document.getElementById('savePw').onclick = async () => {
    try {
      await api('/auth/change-password', { method: 'POST', body: {
        current_password: document.getElementById('pwOld').value,
        new_password: document.getElementById('pwNew').value,
      }});
      toast('Đã đổi mật khẩu', 'ok');
      document.getElementById('pwOld').value = ''; document.getElementById('pwNew').value = '';
    } catch (err) { toast(err.message, 'err'); }
  };
}
