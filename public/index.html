<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BotClarify — Chatbot for company documents</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/assets/brand/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
<meta name="theme-color" content="#ff6320" />
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
<div style="min-height:100vh;display:grid;place-items:center">
  <div style="text-align:center">
    <img class="brand-mark" src="/assets/brand/mark.png" alt="BotClarify" style="margin:0 auto 14px;height:46px" />
    <p class="muted">Redirecting…</p>
  </div>
</div>
<script type="module">
  import {Session, api} from '/assets/app.js';
  (async () => {
    if (!Session.token) return (location.href = '/login.html');
    try {
      const me = await api('/auth/me');
      if (me.user.is_system_admin) return (location.href = '/sysadmin.html');
      const adminOrg = me.organizations.find((o) => o.role === 'admin');
      location.href = adminOrg ? '/admin.html' : '/chat.html';
    } catch { location.href = '/login.html'; }
  })();
</script>
</body>
</html>
