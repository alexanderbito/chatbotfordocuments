<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>System admin — BotClarify</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="/assets/brand/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
<meta name="theme-color" content="#ff6320" />
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
<div class="shell" id="shell"></div>

<script type="module">
import {api, requireSession, buildSidebar, logout, icon, esc, fmt, money, toast, modal, confirmDialog, emptyState, badge, LABEL, renderBars, debounce, router, downloadFile} from '/assets/app.js';

const me = await requireSession({ systemAdmin: true });
let cache = { plans: [], orgs: [] };
let state = { logPage: 1 };

const TITLES = {
  overview: ['System dashboard', 'Customers, usage and revenue at a glance.'],
  orgs: ['Organizations', 'Every company using the platform.'],
  plans: ['Plans', 'Define the limits and price of each plan.'],
  payments: ['Payments', 'Record transactions and extend customer plans.'],
  users: ['Users', 'Every account on the platform.'],
  logs: ['Activity log', 'Events and errors raised while the system runs.'],
  health: ['System health', 'Check connectivity to every upstream service.'],
};

function shell() {
  document.getElementById('shell').innerHTML = `
    ${buildSidebar({
      brandSub: 'System admin',
      user: me.user,
      items: [
        { group: 'Business' },
        { view: 'overview', icon: 'dashboard', label: 'Dashboard' },
        { view: 'orgs', icon: 'building', label: 'Organizations' },
        { view: 'plans', icon: 'card', label: 'Plans' },
        { view: 'payments', icon: 'chart', label: 'Payments' },
        { group: 'Operations' },
        { view: 'users', icon: 'users', label: 'Users' },
        { view: 'logs', icon: 'history', label: 'Activity log' },
        { view: 'health', icon: 'pulse', label: 'System health' },
      ],
    })}
    <div class="main">
      <div class="topbar">
        <div class="title"><h1 id="ttl"></h1><p id="dsc"></p></div>
        <span class="badge purple">${icon.shield} System admin</span>
        <a class="btn" href="/admin.html">Organization console</a>
      </div>
      <div class="page">
        ${Object.keys(TITLES).map((v) => `<section class="page-section" data-view="${v}" id="view-${v}"></section>`).join('')}
      </div>
    </div>`;
  document.getElementById('logoutBtn').onclick = logout;
}

/* =================== DASHBOARD =================== */
async function viewOverview() {
  const el = document.getElementById('view-overview');
  el.innerHTML = '<div class="loading-line"></div>';
  const d = await api('/admin/overview');
  const t = d.totals;

  const stat = (label, value, ic, foot = '') => `
    <div class="stat">
      <div class="row between"><div class="label">${esc(label)}</div><div class="icon">${icon[ic]}</div></div>
      <div class="value">${value}</div>
      ${foot ? `<div class="foot">${foot}</div>` : ''}
    </div>`;

  el.innerHTML = `
    <div class="stat-grid">
      ${stat('Organization', fmt.num(t.organizations), 'building', `${t.suspended_organizations} suspended`)}
      ${stat('Users', fmt.num(t.users), 'users')}
      ${stat('Documents', fmt.num(t.documents), 'file', `${fmt.num(t.chunks)} chunks · ${t.failed_documents} failed`)}
      ${stat('Questions', fmt.num(t.questions), 'chat')}
      ${stat('Size', fmt.mb(t.storage_mb), 'db')}
      ${stat('Revenue this month', fmt.money(d.revenue.this_month), 'card', `${fmt.money(d.revenue.total)} all time`)}
      ${stat('OCR pages this month', fmt.num(d.ocr?.pages_this_month || 0), 'scan', `${fmt.num(d.ocr?.documents || 0)} scanned documents · ${fmt.num(d.ocr?.pages_total || 0)} pages all time`)}
    </div>

    <div class="card">
      <div class="card-head"><h2>Questions over the last 30 days</h2><span class="sub">${fmt.num(d.series.reduce((s, x) => s + x.questions, 0))} questions in total</span></div>
      <div class="card-body"><div id="chartQ"></div></div>
    </div>

    <div class="split" style="grid-template-columns:1fr 1fr">
      <div class="card">
        <div class="card-head"><h3>Uploads over the last 30 days</h3></div>
        <div class="card-body"><div id="chartD"></div></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Customers by plan</h3></div>
        <div class="card-body">
          ${Object.entries(d.by_plan).map(([name, count]) => {
            const total = Object.values(d.by_plan).reduce((s, x) => s + x, 0) || 1;
            const pct = Math.round((count / total) * 100);
            return `<div class="mb-2">
              <div class="row between small"><span>${esc(name)}</span><span class="muted">${count} organizations · ${pct}%</span></div>
              <div class="meter"><i style="width:${pct}%"></i></div></div>`;
          }).join('') || emptyState('No data yet')}
        </div>
      </div>
    </div>`;

  renderBars(document.getElementById('chartQ'), d.series, 'questions');
  renderBars(document.getElementById('chartD'), d.series, 'documents');
}

/* =================== ORGANIZATIONS =================== */
async function viewOrgs() {
  const el = document.getElementById('view-orgs');
  el.innerHTML = `
    <div class="toolbar">
      <div class="search-box">${icon.search}<input type="search" id="oq" placeholder="Search by company name…" /></div>
      <select id="ostatus" style="width:auto"><option value="">Any status</option><option value="active">Active</option><option value="suspended">Suspended</option></select>
      <span class="spacer"></span>
      <button class="btn" id="reloadOrgs">${icon.refresh} Refresh</button>
    </div>
    <div class="card"><div class="card-body flush" id="orgTable">Loading…</div></div>`;
  document.getElementById('oq').oninput = debounce(loadOrgs, 350);
  document.getElementById('ostatus').onchange = loadOrgs;
  document.getElementById('reloadOrgs').onclick = loadOrgs;
  if (!cache.plans.length) cache.plans = await api('/admin/plans');
  await loadOrgs();
}

async function loadOrgs() {
  const box = document.getElementById('orgTable');
  const q = document.getElementById('oq')?.value || '';
  const st = document.getElementById('ostatus')?.value || '';
  const orgs = await api(`/admin/organizations?q=${encodeURIComponent(q)}&status=${st}`);
  cache.orgs = orgs;

  if (!orgs.length) return (box.innerHTML = emptyState('No organizations yet'));

  box.innerHTML = `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>Organization</th><th>Plan</th><th>Billing</th><th class="num">Documents</th><th class="num">Members</th><th class="num">Questions</th><th>Status</th><th>Created</th><th></th></tr></thead>
    <tbody>${orgs.map((o) => `
      <tr>
        <td><div class="cell-main">${esc(o.name)}</div><div class="cell-sub">${esc(o.owner_email)}</div></td>
        <td class="small">${esc(o.plan?.name || '—')}</td>
        <td>${badge(o.billing_status, LABEL.billing)}</td>
        <td class="num">${fmt.num(o.document_count)}</td>
        <td class="num">${fmt.num(o.member_count)}</td>
        <td class="num">${fmt.num(o.question_count)}</td>
        <td>${badge(o.status, LABEL.status)}</td>
        <td class="small nowrap">${esc(fmt.date(o.created_at))}</td>
        <td class="nowrap" style="width:1%">
          <button class="icon-btn" data-view="${esc(o.id)}" title="View details">${icon.search}</button>
          <button class="icon-btn" data-edit="${esc(o.id)}" title="Edit">${icon.edit}</button>
          <button class="icon-btn" data-rm="${esc(o.id)}" title="Delete">${icon.trash}</button>
        </td>
      </tr>`).join('')}</tbody></table></div>`;

  box.querySelectorAll('[data-view]').forEach((b) => (b.onclick = () => orgDetail(b.dataset.view)));
  box.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => orgEdit(orgs.find((o) => o.id === b.dataset.edit))));
  box.querySelectorAll('[data-rm]').forEach((b) => {
    b.onclick = async () => {
      const o = orgs.find((x) => x.id === b.dataset.rm);
      if (!(await confirmDialog('Delete organization', `Permanently delete "${o.name}" along with every document, member and chat message? This cannot be undone.`))) return;
      await api(`/admin/organizations/${o.id}`, { method: 'DELETE' });
      toast('Organization deleted', 'ok'); loadOrgs();
    };
  });
}

async function orgDetail(id) {
  const d = await api(`/admin/organizations/${id}`);
  const o = d.organization, u = d.usage, L = u.limits;
  modal({
    title: o.name, wide: true, okText: 'Close', cancelText: 'Close',
    body: `
      <div class="stat-grid" style="margin-bottom:14px">
        <div class="stat"><div class="label">Documents</div><div class="value" style="font-size:20px">${fmt.num(u.documents)} <small>/ ${fmt.num(L.max_documents)}</small></div></div>
        <div class="stat"><div class="label">Members</div><div class="value" style="font-size:20px">${fmt.num(u.members)} <small>/ ${fmt.num(L.max_members)}</small></div></div>
        <div class="stat"><div class="label">Questions this month</div><div class="value" style="font-size:20px">${fmt.num(u.questions_this_month)}</div></div>
        <div class="stat"><div class="label">Size</div><div class="value" style="font-size:20px">${fmt.mb(u.storage_mb)}</div></div>
        <div class="stat"><div class="label">OCR pages this month</div><div class="value" style="font-size:20px">${fmt.num(u.ocr_pages_this_month)} <small>/ ${fmt.num(L.max_ocr_pages_per_month)}</small></div></div>
      </div>
      <div class="form-grid">
        <div class="field"><label>Plan</label><div>${esc(o.plan?.name || '—')} · ${esc(fmt.money(o.plan?.price_usd || 0))}/month</div></div>
        <div class="field"><label>Valid until</label><div>${esc(o.plan_expires_at ? fmt.date(o.plan_expires_at) : 'unlimited')}</div></div>
        <div class="field"><label>Contact email</label><div>${esc(o.contact_email || '—')}</div></div>
        <div class="field"><label>Tax code</label><div>${esc(o.tax_code || '—')}</div></div>
      </div>
      <h3 class="mt-2 mb-1">Members (${d.members.length})</h3>
      <div class="table-wrap"><table class="tbl"><tbody>
        ${d.members.map((m) => `<tr><td>${esc(m.email)}</td><td style="width:1%">${badge(m.role, LABEL.role)}</td><td style="width:1%">${badge(m.status, LABEL.status)}</td></tr>`).join('') || '<tr><td class="muted">None yet</td></tr>'}
      </tbody></table></div>
      <h3 class="mt-2 mb-1">Recent documents</h3>
      <div class="table-wrap"><table class="tbl"><tbody>
        ${d.recent_documents.map((x) => `<tr><td>${esc(x.filename)}</td><td style="width:1%">${badge(x.status, LABEL.status)}</td><td class="small nowrap" style="width:1%">${esc(fmt.date(x.created_at))}</td></tr>`).join('') || '<tr><td class="muted">None yet</td></tr>'}
      </tbody></table></div>`,
  });
}

function orgEdit(o) {
  const planOpts = cache.plans.map((p) => `<option value="${esc(p.id)}" ${o.plan_id === p.id ? 'selected' : ''}>${esc(p.name)} — ${fmt.money(p.price_usd)}/month</option>`).join('');
  modal({
    title: `Edit organization: ${o.name}`, wide: true,
    body: `
      <div class="form-grid">
        <div class="field"><label>Company name</label><input type="text" id="e_name" value="${esc(o.name)}" /></div>
        <div class="field"><label>Contact email</label><input type="text" id="e_mail" value="${esc(o.contact_email || '')}" /></div>
        <div class="field"><label>Plan</label><select id="e_plan">${planOpts}</select></div>
        <div class="field"><label>Status</label><select id="e_status">
          <option value="active" ${o.status === 'active' ? 'selected' : ''}>Active</option>
          <option value="suspended" ${o.status === 'suspended' ? 'selected' : ''}>Suspended</option></select></div>
        <div class="field"><label>Billing status</label><select id="e_billing">
          <option value="trial" ${o.billing_status === 'trial' ? 'selected' : ''}>Trial</option>
          <option value="paid" ${o.billing_status === 'paid' ? 'selected' : ''}>Paid</option>
          <option value="overdue" ${o.billing_status === 'overdue' ? 'selected' : ''}>Overdue</option></select></div>
        <div class="field"><label>Valid until</label><input type="date" id="e_exp" value="${o.plan_expires_at ? new Date(o.plan_expires_at).toISOString().slice(0, 10) : ''}" /></div>
      </div>
      <div class="field"><label>Internal note</label><textarea id="e_note">${esc(o.note || '')}</textarea></div>`,
    onOk: async (box) => {
      await api(`/admin/organizations/${o.id}`, { method: 'PATCH', body: {
        name: box.querySelector('#e_name').value.trim(),
        contact_email: box.querySelector('#e_mail').value.trim(),
        plan_id: box.querySelector('#e_plan').value,
        status: box.querySelector('#e_status').value,
        billing_status: box.querySelector('#e_billing').value,
        plan_expires_at: box.querySelector('#e_exp').value || null,
        note: box.querySelector('#e_note').value.trim(),
      }});
      toast('Organization updated', 'ok'); loadOrgs();
    },
  });
}

/* =================== PLANS =================== */
async function viewPlans() {
  const el = document.getElementById('view-plans');
  el.innerHTML = `
    <div class="toolbar"><span class="spacer"></span><button class="btn primary" id="addPlan">${icon.plus} New plan</button></div>
    <div class="card"><div class="card-body flush" id="planTable">Loading…</div></div>`;
  document.getElementById('addPlan').onclick = () => planModal();
  await loadPlans();
}

async function loadPlans() {
  cache.plans = await api('/admin/plans');
  document.getElementById('planTable').innerHTML = `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>Plan</th><th class="num">Price/month</th><th class="num">Documents</th><th class="num">Members</th><th class="num">Storage</th><th class="num">Questions/month</th><th class="num">OCR pages/month</th><th>OCR</th><th class="num">In use</th><th>Status</th><th></th></tr></thead>
    <tbody>${cache.plans.map((p) => `
      <tr>
        <td><div class="cell-main">${esc(p.name)}</div><div class="cell-sub mono">${esc(p.code)}</div></td>
        <td class="num">${esc(fmt.money(p.price_usd))}</td>
        <td class="num">${p.price_usd ? '$' + Number(p.price_usd).toFixed(0) : '—'}</td>
        <td class="num">${fmt.num(p.max_documents)}</td>
        <td class="num">${fmt.num(p.max_members)}</td>
        <td class="num">${fmt.num(p.max_storage_mb)} MB</td>
        <td class="num">${fmt.num(p.max_questions_per_month)}</td>
        <td class="num">${fmt.num(p.max_ocr_pages_per_month || 0)}</td>
        <td>${p.ocr_enabled === false ? '<span class="badge">Off</span>' : '<span class="badge ok">On</span>'}</td>
        <td class="num">${fmt.num(p.organization_count)}</td>
        <td>${p.is_active ? '<span class="badge ok">On sale</span>' : '<span class="badge">Retired</span>'}</td>
        <td class="nowrap" style="width:1%">
          <button class="icon-btn" data-edit="${esc(p.id)}">${icon.edit}</button>
          <button class="icon-btn" data-rm="${esc(p.id)}">${icon.trash}</button>
        </td>
      </tr>`).join('')}</tbody></table></div>`;

  document.querySelectorAll('#planTable [data-edit]').forEach((b) => (b.onclick = () => planModal(cache.plans.find((p) => p.id === b.dataset.edit))));
  document.querySelectorAll('#planTable [data-rm]').forEach((b) => {
    b.onclick = async () => {
      const p = cache.plans.find((x) => x.id === b.dataset.rm);
      if (!(await confirmDialog('Delete plan', `Delete the "${p.name}" plan?`))) return;
      try { await api(`/admin/plans/${p.id}`, { method: 'DELETE' }); toast('Plan deleted', 'ok'); loadPlans(); }
      catch (err) { toast(err.message, 'err'); }
    };
  });
}

function planModal(p) {
  const f = (id, label, value, type = 'text') => `<div class="field"><label>${esc(label)}</label><input type="${type}" id="${id}" value="${esc(value ?? '')}" /></div>`;
  modal({
    title: p ? `Edit plan: ${p.name}` : 'New plan', wide: true,
    body: `
      <div class="form-grid">
        ${f('p_code', 'Plan code (lowercase, no spaces)', p?.code)}
        ${f('p_name', 'Display name', p?.name)}
        ${f('p_trial', 'Trial days (0 = paid plan)', p?.trial_days ?? 0, 'number')}
        ${f('p_usd', 'Price per month (USD)', p?.price_usd ?? 0, 'number')}
        ${f('p_sort', 'Sort order', p?.sort_order ?? 0, 'number')}
        ${f('p_docs', 'Max documents', p?.max_documents ?? 20, 'number')}
        ${f('p_members', 'Max members', p?.max_members ?? 5, 'number')}
        ${f('p_storage', 'Max storage (MB)', p?.max_storage_mb ?? 100, 'number')}
        ${f('p_questions', 'Questions per month', p?.max_questions_per_month ?? 500, 'number')}
        ${f('p_ocr', 'OCR pages per month', p?.max_ocr_pages_per_month ?? 50, 'number')}
      </div>
      <div class="field"><label>Description</label><textarea id="p_desc">${esc(p?.description || '')}</textarea></div>
      <label class="check"><input type="checkbox" id="p_active" ${p?.is_active !== false ? 'checked' : ''} /> On sale</label>
      <label class="check"><input type="checkbox" id="p_ocr" ${p?.ocr_enabled !== false ? 'checked' : ''} /> Allow scanned-PDF OCR</label>`,
    onOk: async (box) => {
      const g = (id) => box.querySelector('#' + id).value;
      const body = {
        code: g('p_code').trim(), name: g('p_name').trim(),
        description: g('p_desc').trim(),
        trial_days: g('p_trial'),
        price_usd: g('p_usd'), sort_order: g('p_sort'),
        max_documents: g('p_docs'), max_members: g('p_members'),
        max_storage_mb: g('p_storage'), max_questions_per_month: g('p_questions'),
        max_ocr_pages_per_month: g('p_ocr'),
        is_active: box.querySelector('#p_active').checked,
        ocr_enabled: box.querySelector('#p_ocr').checked,
      };
      if (!body.code || !body.name) { toast('Plan code and name are required', 'err'); return false; }
      if (p) await api(`/admin/plans/${p.id}`, { method: 'PATCH', body });
      else await api('/admin/plans', { method: 'POST', body });
      toast('Plan saved', 'ok'); loadPlans();
    },
  });
}

/* =================== PAYMENTS =================== */
async function viewPayments() {
  const el = document.getElementById('view-payments');
  el.innerHTML = `
    <div class="toolbar">
      <select id="pstatus" style="width:auto"><option value="">Any status</option>
        <option value="paid">Received</option><option value="pending">Pending</option><option value="failed">Failed</option></select>
      <span class="spacer"></span>
      <button class="btn primary" id="addPay">${icon.plus} Record payment</button>
    </div>
    <div class="card"><div class="card-body flush" id="payTable">Loading…</div></div>`;
  document.getElementById('pstatus').onchange = loadPayments;
  document.getElementById('addPay').onclick = paymentModal;
  if (!cache.plans.length) cache.plans = await api('/admin/plans');
  if (!cache.orgs.length) cache.orgs = await api('/admin/organizations');
  await loadPayments();
}

async function loadPayments() {
  const st = document.getElementById('pstatus')?.value || '';
  const rows = await api(`/admin/payments?status=${st}`);
  const box = document.getElementById('payTable');
  if (!rows.length) return (box.innerHTML = emptyState('No transactions yet', 'Use "Record payment" to enter the first one.'));

  box.innerHTML = `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>Date</th><th>Organization</th><th>Plan</th><th>Service period</th><th class="num">Amount</th><th>Method</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows.map((p) => `
      <tr>
        <td class="small nowrap">${esc(fmt.date(p.created_at))}</td>
        <td class="cell-main">${esc(p.organization?.name || '—')}</td>
        <td class="small">${esc(p.plan?.name || '—')}</td>
        <td class="small nowrap">${esc(fmt.date(p.period_start))} → ${esc(fmt.date(p.period_end))}</td>
        <td class="num">${esc(money(p.amount, p.currency || 'USD'))}</td>
        <td class="small">${esc(p.method || '—')}</td>
        <td>${badge(p.status, LABEL.payment)}</td>
        <td class="nowrap" style="width:1%">${p.status === 'pending' ? `<button class="btn sm" data-ok="${esc(p.id)}">Mark as received</button>` : ''}${p.paid_at ? `<button class="btn sm" data-invoice="${esc(p.id)}" title="Download invoice">${icon.download}</button>` : ''}</td>
      </tr>`).join('')}</tbody></table></div>`;

  box.querySelectorAll('[data-invoice]').forEach((b) => {
    b.onclick = async () => {
      const original = b.innerHTML;
      b.disabled = true; b.textContent = '…';
      try { await downloadFile(`/admin/payments/${b.dataset.invoice}/invoice.pdf`, 'invoice.pdf'); }
      catch (err) { toast(err.message, 'err'); }
      b.disabled = false; b.innerHTML = original;
    };
  });

  box.querySelectorAll('[data-ok]').forEach((b) => {
    b.onclick = async () => {
      await api(`/admin/payments/${b.dataset.ok}`, { method: 'PATCH', body: { status: 'paid' } });
      toast('Payment confirmed', 'ok'); loadPayments();
    };
  });
}

function paymentModal() {
  const today = new Date();
  const nextMonth = new Date(today); nextMonth.setMonth(today.getMonth() + 1);
  modal({
    title: 'Record payment', wide: true, okText: 'Save transaction',
    body: `
      <div class="form-grid">
        <div class="field"><label>Organization</label><select id="y_org">${cache.orgs.map((o) => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Plan</label><select id="y_plan">${cache.plans.map((p) => `<option value="${esc(p.id)}" data-price="${p.price_usd}">${esc(p.name)} — ${fmt.money(p.price_usd)}</option>`).join('')}</select></div>
        <div class="field"><label>Amount (USD)</label><input type="number" step="0.01" id="y_amount" value="${cache.plans[0]?.price_usd || 0}" /></div>
        <div class="field"><label>Method</label><select id="y_method">
          <option value="paypal">PayPal</option><option value="card">Card</option>
          <option value="bank_transfer">Bank transfer</option><option value="manual">Manual entry</option></select></div>
        <div class="field"><label>From</label><input type="date" id="y_start" value="${today.toISOString().slice(0, 10)}" /></div>
        <div class="field"><label>To</label><input type="date" id="y_end" value="${nextMonth.toISOString().slice(0, 10)}" /></div>
        <div class="field"><label>Status</label><select id="y_status"><option value="paid">Received</option><option value="pending">Pending</option></select></div>
        <div class="field"><label>Reference</label><input type="text" id="y_ref" placeholder="Gateway or bank transaction id" /></div>
      </div>
      <div class="field"><label>Note</label><textarea id="y_note"></textarea></div>
      <div class="alert info show">Setting the status to "Received" activates the plan and extends the expiry date immediately.</div>`,
    onOk: async (box) => {
      const g = (id) => box.querySelector('#' + id).value;
      await api('/admin/payments', { method: 'POST', body: {
        organization_id: g('y_org'), plan_id: g('y_plan'), amount: g('y_amount'),
        period_start: g('y_start'), period_end: g('y_end'), status: g('y_status'),
        method: g('y_method'), reference: g('y_ref').trim(), note: g('y_note').trim(),
      }});
      toast('Payment recorded', 'ok'); loadPayments();
    },
  }).el.querySelector('#y_plan').onchange = (e) => {
    const price = e.target.selectedOptions[0]?.dataset.price;
    if (price !== undefined) document.getElementById('y_amount').value = price;
  };
}

/* =================== USERS =================== */
async function viewUsers() {
  const el = document.getElementById('view-users');
  el.innerHTML = `
    <div class="card"><div class="card-head"><h3>System admin</h3>
      <span class="sub">Accounts that can read every organization's data</span>
      <button class="btn primary" id="newAdmin">${icon.plus} Create account an admin</button></div>
      <div class="card-body flush" id="adminBox">Loading…</div></div>

    <div class="toolbar"><div class="search-box">${icon.search}<input type="search" id="uq" placeholder="Search by email…" /></div></div>
    <div class="card"><div class="card-body flush" id="userTable">Loading…</div></div>`;
  document.getElementById('uq').oninput = debounce(loadUsers, 350);
  document.getElementById('newAdmin').onclick = newAdminModal;
  await Promise.all([loadUsers(), loadSystemAdmins()]);
}

async function loadUsers() {
  const q = document.getElementById('uq')?.value || '';
  const users = await api(`/admin/users?q=${encodeURIComponent(q)}`);
  const box = document.getElementById('userTable');
  if (!users.length) return (box.innerHTML = emptyState('No users found'));

  box.innerHTML = `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>User</th><th>System access</th><th>Status</th><th>Last sign-in</th><th>Created</th><th></th></tr></thead>
    <tbody>${users.map((u) => `
      <tr>
        <td><div class="cell-main">${esc(u.full_name || u.email.split('@')[0])}</div><div class="cell-sub">${esc(u.email)}</div></td>
        <td>${u.is_system_admin ? '<span class="badge purple">System admin</span>' : '<span class="badge">User</span>'}</td>
        <td>${badge(u.status, LABEL.status)}</td>
        <td class="small">${esc(fmt.ago(u.last_login_at))}</td>
        <td class="small nowrap">${esc(fmt.date(u.created_at))}</td>
        <td class="nowrap" style="width:1%">
          <button class="btn sm" data-sa="${esc(u.id)}" data-on="${u.is_system_admin ? '1' : '0'}">${u.is_system_admin ? 'Revoke admin' : 'Grant admin'}</button>
          <button class="btn sm" data-block="${esc(u.id)}" data-st="${esc(u.status)}">${u.status === 'disabled' ? 'Unblock' : 'Block'}</button>
        </td>
      </tr>`).join('')}</tbody></table></div>`;

  box.querySelectorAll('[data-sa]').forEach((b) => {
    b.onclick = async () => {
      try {
        await api(`/admin/users/${b.dataset.sa}`, { method: 'PATCH', body: { is_system_admin: b.dataset.on !== '1' } });
        toast('Access updated', 'ok'); loadUsers(); loadSystemAdmins();
      } catch (err) { toast(err.message, 'err'); }
    };
  });
  box.querySelectorAll('[data-block]').forEach((b) => {
    b.onclick = async () => {
      await api(`/admin/users/${b.dataset.block}`, { method: 'PATCH', body: { status: b.dataset.st === 'disabled' ? 'active' : 'disabled' } });
      toast('Status updated', 'ok'); loadUsers(); loadSystemAdmins();
    };
  });
}

async function loadSystemAdmins() {
  const box = document.getElementById('adminBox');
  if (!box) return;
  const d = await api('/admin/system-admins');

  const rows = d.admins.map((a) => `
    <tr>
      <td><div class="cell-main">${esc(a.full_name || a.email.split('@')[0])}</div>
          <div class="cell-sub">${esc(a.email)}</div></td>
      <td>${a.from_env ? '<span class="badge purple">From environment</span>' : '<span class="badge info">Granted in app</span>'}</td>
      <td>${badge(a.status, LABEL.status)}</td>
      <td class="small">${esc(fmt.ago(a.last_login_at))}</td>
    </tr>`).join('');

  const pending = d.env_pending.map((e) => `
    <tr>
      <td><div class="cell-main">${esc(e)}</div>
          <div class="cell-sub">Listed in SYSTEM_ADMIN_EMAILS but has not registered yet</div></td>
      <td><span class="badge purple">From environment</span></td>
      <td><span class="badge warn">Awaiting sign-up</span></td>
      <td class="small">—</td>
    </tr>`).join('');

  box.innerHTML = `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>Account</th><th>Granted by</th><th>Status</th><th>Last sign-in</th></tr></thead>
    <tbody>${rows}${pending}</tbody></table></div>
    ${d.env_emails.length
      ? `<div class="card-body" style="padding-top:0"><p class="small muted mb-0">SYSTEM_ADMIN_EMAILS currently lists <span class="mono">${esc(d.env_emails.join(', '))}</span>. These addresses always keep access — revoking them here has no effect until they are removed from the environment variable.</p></div>`
      : `<div class="card-body" style="padding-top:0"><p class="small muted mb-0">SYSTEM_ADMIN_EMAILS is not set. Set it on the server so there is a way back in if every admin account is lost.</p></div>`}`;
}

function newAdminModal() {
  modal({
    title: 'Create system administrator',
    okText: 'Create account',
    body: `
      <div class="alert info show">A system administrator <b>can read the documents and chat history of every organization</b>. Grant this only to people who genuinely need it.</div>
      <div class="field"><label>Email</label><input type="email" id="na_email" placeholder="admin@company.com" /></div>
      <div class="field"><label>Full name</label><input type="text" id="na_name" /></div>
      <div class="field"><label>Password</label><input type="password" id="na_pw" placeholder="At least 8 characters" />
        <div class="hint">Use a strong password and share it over a secure channel. Ask them to change it after their first sign-in.</div></div>`,
    onOk: async (box) => {
      const email = box.querySelector('#na_email').value.trim();
      const pw = box.querySelector('#na_pw').value;
      if (!email) { toast('Please enter an email', 'err'); return false; }
      if (pw.length < 8) { toast('Password must be at least 8 characters', 'err'); return false; }

      await api('/admin/users', { method: 'POST', body: {
        email, password: pw, full_name: box.querySelector('#na_name').value.trim(),
      }});
      toast('System administrator created', 'ok');
      loadSystemAdmins(); loadUsers();
    },
  });
}

/* =================== ACTIVITY LOG =================== */
async function viewLogs() {
  const el = document.getElementById('view-logs');
  el.innerHTML = `
    <div class="toolbar">
      <select id="llevel" style="width:auto"><option value="">Any level</option><option value="info">Info</option><option value="warn">Warning</option><option value="error">Error</option></select>
      <select id="lscope" style="width:auto"><option value="">Any area</option><option value="auth">Account</option><option value="upload">Documents</option><option value="chat">Chat</option><option value="billing">Payments</option><option value="system">System</option></select>
      <span class="spacer"></span>
      <button class="btn" id="reloadLogs">${icon.refresh} Refresh</button>
    </div>
    <div class="card"><div class="card-head"><h3>Documents that failed to process</h3></div><div class="card-body flush" id="failedBox">Loading…</div></div>
    <div class="card"><div class="card-body flush" id="logBox">Loading…</div><div class="pager" id="logPager"></div></div>`;
  document.getElementById('llevel').onchange = () => { state.logPage = 1; loadLogs(); };
  document.getElementById('lscope').onchange = () => { state.logPage = 1; loadLogs(); };
  document.getElementById('reloadLogs').onclick = () => { loadLogs(); loadFailed(); };
  await Promise.all([loadLogs(), loadFailed()]);
}

async function loadFailed() {
  const rows = await api('/admin/failed-documents');
  const box = document.getElementById('failedBox');
  if (!rows.length) return (box.innerHTML = `<div class="card-body"><span class="badge ok">${icon.check} No documents have failed</span></div>`);
  box.innerHTML = `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>Document</th><th>Organization</th><th>Reason</th><th>When</th></tr></thead>
    <tbody>${rows.map((r) => `<tr>
      <td class="cell-main">${esc(r.filename)}</td>
      <td class="small">${esc(r.organization?.name || '—')}</td>
      <td class="small" style="color:var(--danger)">${esc(r.error_message || 'Unknown')}</td>
      <td class="small nowrap">${esc(fmt.dateTime(r.created_at))}</td></tr>`).join('')}</tbody></table></div>`;
}

async function loadLogs() {
  const level = document.getElementById('llevel')?.value || '';
  const scope = document.getElementById('lscope')?.value || '';
  const res = await api(`/admin/logs?page=${state.logPage}&size=50&level=${level}&scope=${scope}`);
  const box = document.getElementById('logBox');

  if (!res.items.length) { box.innerHTML = emptyState('Nothing logged yet'); document.getElementById('logPager').innerHTML = ''; return; }

  box.innerHTML = `<div class="table-wrap"><table class="tbl">
    <thead><tr><th>Time</th><th>Level</th><th>Area</th><th>Message</th><th>Organization</th></tr></thead>
    <tbody>${res.items.map((l) => `
      <tr>
        <td class="small nowrap">${esc(fmt.dateTime(l.created_at))}</td>
        <td>${badge(l.level === 'error' ? 'err' : l.level === 'warn' ? 'warn' : 'info', { err: 'Failed', warn: 'Warning', info: 'Info' })}</td>
        <td class="small">${esc(LABEL.scope[l.scope] || l.scope)}</td>
        <td>${esc(l.message)}${l.detail ? `<div class="cell-sub mono truncate" style="max-width:420px">${esc(JSON.stringify(l.detail))}</div>` : ''}</td>
        <td class="small">${esc(l.organization?.name || '—')}</td>
      </tr>`).join('')}</tbody></table></div>`;

  const pages = Math.ceil(res.total / res.size);
  document.getElementById('logPager').innerHTML = `
    <span>${fmt.num(res.total)} entries · page ${res.page}/${pages || 1}</span>
    <button class="btn sm" id="lprev" ${res.page <= 1 ? 'disabled' : ''}>Previous</button>
    <button class="btn sm" id="lnext" ${res.page >= pages ? 'disabled' : ''}>Next</button>`;
  const prev = document.getElementById('lprev'), next = document.getElementById('lnext');
  if (prev) prev.onclick = () => { state.logPage--; loadLogs(); };
  if (next) next.onclick = () => { state.logPage++; loadLogs(); };
}

/* =================== SYSTEM HEALTH =================== */
async function viewHealth() {
  const el = document.getElementById('view-health');
  el.innerHTML = `
    <div class="card">
      <div class="card-head"><h2>Upstream service checks</h2>
        <span class="sub">Makes one real call to each service. Voyage and DeepSeek charge a tiny amount per run.</span>
        <button class="btn primary" id="runHealth">${icon.pulse} Run checks</button></div>
      <div class="card-body" id="healthBox">
        <p class="muted mb-0">Run the checks to see connectivity to Supabase, Cloudflare R2, Voyage AI, DeepSeek, Gemini and the payment gateway.</p>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Data maintenance</h2>
        <span class="sub">Repair older document names stored as mojibake or in NFD (decomposed) form.</span>
      </div>
      <div class="card-body">
        <div class="btn-row">
          <button class="btn" id="fixDry">Preview changes</button>
          <button class="btn primary" id="fixRun">Repair names</button>
        </div>
        <div id="fixBox" class="mt-2"></div>
      </div>
    </div>`;

  const runFix = async (dry, btn) => {
    btn.disabled = true;
    const box = document.getElementById('fixBox');
    box.innerHTML = '<div class="loading-line"></div>';
    try {
      const d = await api(`/admin/maintenance/fix-filenames${dry ? '?dry_run=1' : ''}`, { method: 'POST' });
      if (!d.changed) {
        box.innerHTML = `<span class="badge ok">${icon.check} Scanned ${fmt.num(d.scanned)} documents — no names need repair</span>`;
      } else {
        box.innerHTML = `
          <div class="alert ${dry ? 'info' : 'success'} show">${dry
            ? `${fmt.num(d.changed)} of ${fmt.num(d.scanned)} documents need repair. Use "Repair names" to apply.`
            : `Repaired ${fmt.num(d.changed)} of ${fmt.num(d.scanned)} documents.`}</div>
          <div class="table-wrap"><table class="tbl">
            <thead><tr><th>Current name</th><th>After repair</th></tr></thead>
            <tbody>${d.changes.map((c) => `<tr>
              <td class="small" style="color:var(--danger)">${esc(c.from)}</td>
              <td class="small">${esc(c.to)}</td></tr>`).join('')}</tbody></table></div>`;
      }
      if (!dry) toast('Document names updated', 'ok');
    } catch (err) { box.innerHTML = `<div class="alert error show">${esc(err.message)}</div>`; }
    finally { btn.disabled = false; }
  };
  document.getElementById('fixDry').onclick = (e) => runFix(true, e.target);
  document.getElementById('fixRun').onclick = (e) => runFix(false, e.target);
  document.getElementById('runHealth').onclick = async (e) => {
    e.target.disabled = true;
    const box = document.getElementById('healthBox');
    box.innerHTML = '<div class="loading-line"></div><p class="muted mt-2">Running checks…</p>';
    try {
      const d = await api('/admin/health');
      box.innerHTML = `
        <div class="table-wrap"><table class="tbl">
          <thead><tr><th>Service</th><th>Status</th><th class="num">Response time</th><th>Detail</th></tr></thead>
          <tbody>${d.checks.map((c) => `<tr>
            <td class="cell-main">${esc(c.name)}${c.optional ? ' <span class="badge tiny">optional</span>' : ''}</td>
            <td>${c.ok && c.warning ? '<span class="badge warn">Needs attention</span>' : c.ok ? '<span class="badge ok">Healthy</span>' : c.optional ? '<span class="badge warn">Not configured</span>' : '<span class="badge err">Failed</span>'}</td>
            <td class="num small">${c.ms} ms</td>
            <td class="small ${c.ok && !c.warning ? 'muted' : ''}" style="${c.ok || c.optional ? (c.warning ? 'color:var(--warn,#b26b00)' : '') : 'color:var(--danger)'}">${esc(c.detail)}</td>
          </tr>`).join('')}</tbody></table></div>
        ${d.queue ? `<div class="mt-2 row wrap" style="gap:14px">
          <span class="badge ${d.queue.running ? 'warn' : 'ok'}">Processing queue: ${d.queue.running} running</span>
          <span class="badge">${d.queue.waiting} waiting / ${d.queue.max_queue} max</span>
          <span class="badge">Concurrency: ${d.queue.concurrency}</span>
        </div>` : ''}
        <p class="small muted mt-2 mb-0">Checked at ${esc(fmt.dateTime(d.checked_at))}</p>`;
    } catch (err) { box.innerHTML = `<div class="alert error show">${esc(err.message)}</div>`; }
    finally { e.target.disabled = false; }
  };
}

shell();

}, 'overview');
