<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bảng giá — DocBot</title>
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
<div class="page" style="max-width:1080px;margin:0 auto;padding-top:40px">
  <div class="row between mb-2">
    <a href="/" class="brand" style="padding:0;text-decoration:none">
      <div class="brand-mark">D</div>
      <div><div class="brand-name" style="color:var(--text)">DocBot</div><div class="brand-sub" style="color:var(--muted)">Chatbot tài liệu doanh nghiệp</div></div>
    </a>
    <div class="btn-row" id="navBtns"></div>
  </div>
  <div class="row" style="justify-content:flex-end;margin-bottom:8px" id="langBox"></div>

  <div class="pricing-head">
    <h1 id="ttl">Chọn gói phù hợp với doanh nghiệp bạn</h1>
    <p id="sub">Mọi gói đều dùng chung một hệ thống, khác nhau ở hạn mức. Đổi gói bất kỳ lúc nào.</p>
    <p class="small muted mt-1" id="curNote"></p>
  </div>

  <div id="plans" class="plan-grid"><div class="loading-line"></div></div>

  <p class="small muted mt-3" id="note" style="text-align:center"></p>
</div>

<script type="module">
import { api, Session, fmt, esc, icon, toast, modal,
  t, currency, money, preferredProvider, langSwitcherHtml, bindLangSwitcher, observeAndTranslate } from '/assets/app.js';

document.getElementById('langBox').innerHTML = langSwitcherHtml().replace('lang-switch', 'lang-switch light');
bindLangSwitcher();
observeAndTranslate();

let me = null;
try { if (Session.token) me = await api('/auth/me'); } catch { me = null; }

document.getElementById('navBtns').innerHTML = me
  ? `<a class="btn" href="/admin.html">${esc(t('Bảng quản trị'))}</a>`
  : `<a class="btn" href="/login.html">${esc(t('Đăng nhập'))}</a><a class="btn primary" href="/register.html">${esc(t('Dùng thử miễn phí'))}</a>`;

document.getElementById('ttl').textContent = t('Chọn gói phù hợp với doanh nghiệp bạn');
document.getElementById('sub').textContent = t('Mọi gói đều dùng chung một hệ thống, khác nhau ở hạn mức. Đổi gói bất kỳ lúc nào.');
document.getElementById('curNote').textContent = currency() === 'VND'
  ? t('Giá hiển thị bằng VNĐ, thanh toán bằng chuyển khoản / VietQR. Đổi sang English để xem giá USD.')
  : t('Prices shown in USD, paid by PayPal. Switch to Tiếng Việt for VND pricing and bank transfer.');
document.getElementById('note').textContent = currency() === 'VND'
  ? t('Giá chưa bao gồm VAT. Cần hoá đơn đỏ, vui lòng liên hệ trước khi thanh toán.')
  : t('Billed monthly. Contact us for annual billing or custom limits.');

let data = null;

async function load() {
  const box = document.getElementById('plans');
  box.innerHTML = '<div class="loading-line"></div>';
  try {
    data = await api(`/public/billing/plans?currency=${currency()}`);
  } catch (err) { box.innerHTML = `<div class="alert error show">${esc(err.message)}</div>`; return; }

  box.innerHTML = data.plans.map((p, i) => {
    const featured = i === 1;
    const isTrial = Number(p.trial_days) > 0;
    const feats = [
      `${fmt.num(p.max_documents)} ${t('tài liệu')}`,
      `${fmt.num(p.max_members)} ${t('thành viên')}`,
      `${fmt.num(p.max_questions_per_month)} ${t('lượt hỏi/tháng')}`,
      p.ocr_enabled
        ? `${fmt.num(p.max_ocr_pages_per_month)} ${t('trang nhận dạng PDF scan')}`
        : t('Không có nhận dạng PDF scan'),
      `${fmt.num(p.max_storage_mb)} MB ${t('dung lượng')}`,
    ];
    return `
      <div class="plan-card ${featured ? 'featured' : ''}">
        ${featured ? `<span class="tag">${esc(t('Phổ biến nhất'))}</span>` : ''}
        <h3>${esc(p.name)}</h3>
        <div class="blurb">${esc(p.description || '')}</div>
        <div class="plan-price">${isTrial ? esc(t('Miễn phí')) : esc(money(p.price, data.currency))}${isTrial ? '' : `<small> ${esc(t('/tháng'))}</small>`}</div>
        ${isTrial ? `<div class="small" style="color:var(--warn);font-weight:600">${esc(t('{n} ngày, sau đó tài liệu bị xoá', { n: p.trial_days }))}</div>` : ''}
        <ul class="plan-feats">${feats.map((f, idx) => { const off = idx === 3 && !p.ocr_enabled; return `<li class="${off ? 'off' : ''}">${off ? icon.close : icon.check}<span>${esc(f)}</span></li>`; }).join('')}</ul>
        <button class="btn ${featured ? 'primary' : ''} block" data-plan="${esc(p.id)}" ${isTrial ? 'data-trial="1"' : ''}>
          ${esc(isTrial ? t('Bắt đầu miễn phí') : t('Chọn gói này'))}
        </button>
      </div>`;
  }).join('');

  box.querySelectorAll('[data-plan]').forEach((b) => (b.onclick = () => choose(b.dataset.plan, !!b.dataset.trial)));
}

async function choose(planId, isTrial) {
  if (!me) { location.href = '/register.html'; return; }
  if (isTrial) { location.href = '/admin.html#billing'; return; }

  const orgs = me.organizations.filter((o) => o.role === 'admin');
  if (!orgs.length) { toast(t('Chỉ quản trị viên doanh nghiệp mới đổi được gói'), 'err'); return; }

  const plan = data.plans.find((p) => p.id === planId);
  const providers = data.providers || [];
  if (!providers.length) {
    toast(t('Máy chủ chưa bật cổng thanh toán nào. Liên hệ quản trị hệ thống.'), 'err');
    return;
  }

  // Ngôn ngữ quyết định cổng gợi ý: tiếng Việt -> VietQR, tiếng Anh -> PayPal
  const wanted = preferredProvider();
  const ordered = [...providers].sort((a, b) => Number(b.id === wanted) - Number(a.id === wanted));

  modal({
    title: t('Thanh toán gói {name}', { name: plan.name }),
    okText: t('Tiếp tục thanh toán'),
    body: `
      ${orgs.length > 1 ? `<div class="field"><label>${esc(t('Doanh nghiệp'))}</label>
        <select id="pOrg" data-no-i18n>${orgs.map((o) => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</select></div>` : ''}
      <div class="field">
        <label>${esc(t('Phương thức thanh toán'))}</label>
        ${ordered.map((p, i) => `
          <label class="pay-method ${i === 0 ? 'sel' : ''}">
            <input type="radio" name="prov" value="${esc(p.id)}" ${i === 0 ? 'checked' : ''} />
            <span class="who"><b>${esc(t(p.name))}</b><span>${esc(t(p.description))}</span></span>
          </label>`).join('')}
      </div>
      <div class="row between" style="padding-top:10px;border-top:1px solid var(--border)">
        <b>${esc(t('Tổng thanh toán'))}</b>
        <b style="font-size:18px">${esc(money(plan.price, data.currency))}</b>
      </div>
      <p class="small muted mt-1 mb-0">${esc(t('Gói có hiệu lực ngay sau khi hệ thống nhận được tiền.'))}</p>`,
    onOk: async (box) => {
      const orgId = box.querySelector('#pOrg')?.value || orgs[0].id;
      const provider = box.querySelector('input[name="prov"]:checked').value;
      const res = await api(`/orgs/${orgId}/billing/checkout`, {
        method: 'POST',
        body: { plan_id: planId, provider },
      });
      location.href = res.checkout_url;
      return false;
    },
  });

  document.querySelectorAll('.pay-method').forEach((el) => {
    el.onclick = () => {
      document.querySelectorAll('.pay-method').forEach((x) => x.classList.remove('sel'));
      el.classList.add('sel');
    };
  });
}

load();
</script>
</body>
</html>
